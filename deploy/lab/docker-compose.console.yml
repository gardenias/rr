# Opt-in Rr Console overlay for the local lab. The base lab stack is unchanged.
# Build the static export before building the image: just console-build
# Set RR_CONSOLE_TOKEN and RR_CONSOLE_TLS_CERT/RR_CONSOLE_TLS_KEY/RR_CONSOLE_CA_CERT.
# The files must be readable by container UID 10001, and the certificate must
# cover localhost and 127.0.0.1 for the browser and healthcheck. Then run:
#   docker compose -f deploy/lab/docker-compose.yml -f deploy/lab/docker-compose.console.yml up -d --build
# Open https://localhost:8080 using the CA that signed the Console certificate.

services:
  console:
    image: rr-lab:dev
    container_name: rr-lab-console
    networks: [rrlab]
    entrypoint: ["/usr/local/bin/rr-admin"]
    command:
      - "console"
      - "--listen"
      - "0.0.0.0:8080"
      - "--peers"
      - "1@kv-1:52001,2@kv-2:52001,3@kv-3:52001"
      - "--static-dir"
      - "/usr/local/share/rr-admin/console"
      - "--tls-cert"
      - "/etc/rr/console/tls.crt"
      - "--tls-key"
      - "/etc/rr/console/tls.key"
    environment:
      RUST_LOG: "info"
      RR_CONSOLE_TOKEN: ${RR_CONSOLE_TOKEN:?set RR_CONSOLE_TOKEN before enabling the Console overlay}
    volumes:
      - ${RR_CONSOLE_TLS_CERT:?set RR_CONSOLE_TLS_CERT before enabling the Console overlay}:/etc/rr/console/tls.crt:ro
      - ${RR_CONSOLE_TLS_KEY:?set RR_CONSOLE_TLS_KEY before enabling the Console overlay}:/etc/rr/console/tls.key:ro
      - ${RR_CONSOLE_CA_CERT:?set RR_CONSOLE_CA_CERT before enabling the Console overlay}:/etc/rr/console/ca.crt:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kv-1:
        condition: service_started
      kv-2:
        condition: service_started
      kv-3:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/etc/rr/console/ca.crt", "-o", "/dev/null", "https://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
