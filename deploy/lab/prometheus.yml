# Prometheus scrape configuration for the rr local lab.
# Recording rules and alerts come from deploy/observability/prometheus/.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rr/recording-rules.yml
  - /etc/prometheus/rr/alerts.yml

scrape_configs:
  - job_name: rr
    static_configs:
      - targets: ["kv-1:9100"]
        labels:
          cluster: rrlab
          node_id: "1"
      - targets: ["kv-2:9100"]
        labels:
          cluster: rrlab
          node_id: "2"
      - targets: ["kv-3:9100"]
        labels:
          cluster: rrlab
          node_id: "3"
