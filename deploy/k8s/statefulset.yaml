# rr — 3-node multi-Raft StatefulSet (raw manifests; the Helm chart lives in
# deploy/helm/rr).
#
# DEFAULT = SECURE-ON. rr-server runs startup security gates
# (validate_security_invariants in crates/rr-server/src/node.rs): five gates
# (G1-G5) guard the gRPC transport — RaftService without TLS, TLS without mTLS
# (require_client_cert), bearer auth without TLS, and AdminService without
# TLS / without admin_token all REFUSE to boot. G6/G7 apply to the
# experimental TCP transport, which these manifests do not use.
# These manifests therefore reference two Secrets that you MUST create before
# applying (they intentionally do NOT live in this repo):
#
#   # TLS keypair + CA, keys must be named tls.crt / tls.key / ca.crt.
#   # SANs must cover rr-0.rr / rr-1.rr / rr-2.rr (headless service DNS) and
#   # the rr-client service DNS, because RaftService uses mTLS as its ONLY
#   # peer-identity check. scripts/gen-dev-certs.sh makes dev-only certs;
#   # use cert-manager or your PKI for anything real.
#   kubectl create secret generic rr-tls \
#     --from-file=tls.crt=node.pem --from-file=tls.key=node.key --from-file=ca.crt=ca.pem
#
#   # Admin bearer token, referenced by [auth].admin_token_env in the ConfigMap.
#   kubectl create secret generic rr-admin-token \
#     --from-literal=token="$(openssl rand -hex 32)"
#
# LOCAL PLAYGROUND ONLY (kind/minikube, no certs): uncomment the
# RR_ALLOW_INSECURE env entry in the StatefulSet below, comment out the [tls]
# section in the ConfigMap template, and drop the tls volume + volumeMount.
# This bypasses the five gRPC startup gates (G1-G5) and satisfies G6's
# insecure opt-in; G6/G7 apply to the experimental TCP transport and the G7
# TCP-loopback gate is never bypassed — never enable it outside a throwaway
# local cluster.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rr-config
  labels:
    app.kubernetes.io/name: rr
data:
  config.toml.tmpl: |
    # Each pod renders its own config from this template using the POD_NAME.
    # NODE_ID is derived from the StatefulSet ordinal (rr-0 → 1, rr-1 → 2, ...).
    # BOOTSTRAP is true only for rr-0.
    [node]
    id = {{NODE_ID}}
    listen_addr = "0.0.0.0:51001"
    data_dir = "/var/lib/rr/data"
    admin_port = 52001
    metrics_port = 9100
    # Prometheus scrapes cross-pod: bind the HTTP observability server wide
    # (v0.3.0 defaults it to loopback).
    metrics_bind_host = "0.0.0.0"

    [storage]
    backend = "rocks"
    durability = "strict"

    [cluster]
    bootstrap = {{BOOTSTRAP}}
    peers = {{PEERS}}

    [auth]
    admin_token_env = "RR_ADMIN_TOKEN"

    # Secure default: TLS + mTLS (required by the startup security gates —
    # RaftService has no token path, so require_client_cert must stay true).
    [tls]
    cert_path = "/etc/rr/tls/tls.crt"
    key_path  = "/etc/rr/tls/tls.key"
    ca_path   = "/etc/rr/tls/ca.crt"
    require_client_cert = true
---
apiVersion: v1
kind: Service
metadata:
  name: rr
  labels:
    app.kubernetes.io/name: rr
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rr
  ports:
    - name: grpc
      port: 51001
      targetPort: 51001
    - name: admin
      port: 52001
      targetPort: 52001
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: Service
metadata:
  name: rr-client
  labels:
    app.kubernetes.io/name: rr
    app.kubernetes.io/component: client-endpoint
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rr
  ports:
    - name: grpc
      port: 51001
      targetPort: 51001
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rr
  labels:
    app.kubernetes.io/name: rr
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rr
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rr
  labels:
    app.kubernetes.io/name: rr
spec:
  serviceName: rr
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: rr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rr
    spec:
      terminationGracePeriodSeconds: 30
      # Spread pods across nodes (best effort) so a single host failure cannot
      # take out 2 replicas and break raft quorum. Preferred, not required:
      # single-node local clusters (kind/minikube) must still schedule.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rr
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: render-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              set -eu
              ORDINAL="${POD_NAME##*-}"
              NODE_ID=$((ORDINAL + 1))
              if [ "$ORDINAL" = "0" ]; then
                BOOTSTRAP=true
                PEERS="[]"
              else
                BOOTSTRAP=false
                PEERS_JSON="["
                for i in $(seq 0 $((ORDINAL - 1))); do
                  [ $i -gt 0 ] && PEERS_JSON="${PEERS_JSON},"
                  PEERS_JSON="${PEERS_JSON}\"rr-${i}.rr:51001\""
                done
                PEERS="${PEERS_JSON}]"
              fi
              sed \
                -e "s|{{NODE_ID}}|${NODE_ID}|g" \
                -e "s|{{BOOTSTRAP}}|${BOOTSTRAP}|g" \
                -e "s|{{PEERS}}|${PEERS}|g" \
                /tmpl/config.toml.tmpl > /rendered/config.toml
              echo "--- rendered config for ${POD_NAME} ---"
              cat /rendered/config.toml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config-template
              mountPath: /tmpl
            - name: config-rendered
              mountPath: /rendered
      containers:
        - name: rr-server
          image: ghcr.io/gardenias/rr:latest
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/rr/config.toml"]
          env:
            # REQUIRED in the default secure posture: a missing token means
            # AdminService runs without auth, which the startup gates reject
            # (optional: false on purpose so a forgotten Secret fails fast at
            # scheduling time instead of CrashLoopBackOff at runtime).
            - name: RR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rr-admin-token
                  key: token
                  optional: false
            # LOCAL PLAYGROUND ONLY — bypasses the five gRPC startup gates
            # (G1-G5); G6/G7 apply to the experimental TCP transport (the G7
            # loopback gate is never bypassed). Also comment out [tls] in the
            # ConfigMap template and the tls volume/volumeMount below. NEVER
            # enable in production.
            # - name: RR_ALLOW_INSECURE
            #   value: "true"
            - name: RUST_LOG
              value: "info"
          ports:
            - name: grpc
              containerPort: 51001
            - name: admin
              containerPort: 52001
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rr/data
            - name: config-rendered
              mountPath: /etc/rr
            - name: tls
              mountPath: /etc/rr/tls
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: config-template
          configMap:
            name: rr-config
        - name: config-rendered
          emptyDir: {}
        # TLS keypair + CA (keys: tls.crt, tls.key, ca.crt). See the header
        # comment for how to create it; intentionally not in this repo.
        - name: tls
          secret:
            secretName: rr-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
