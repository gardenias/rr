apiVersion: v1
kind: ConfigMap
metadata:
  name: rr-config
  labels:
    app.kubernetes.io/name: rr
data:
  config.toml.tmpl: |
    # Each pod renders its own config from this template using the POD_NAME.
    # NODE_ID is derived from the StatefulSet ordinal (rr-0 → 1, rr-1 → 2, ...).
    # BOOTSTRAP is true only for rr-0.
    [node]
    id = {{NODE_ID}}
    listen_addr = "0.0.0.0:51001"
    data_dir = "/var/lib/rr/data"
    admin_port = 52001
    metrics_port = 9100

    [storage]
    backend = "rocks"
    durability = "strict"

    [cluster]
    bootstrap = {{BOOTSTRAP}}
    peers = {{PEERS}}

    [auth]
    admin_token_env = "RR_ADMIN_TOKEN"
---
apiVersion: v1
kind: Service
metadata:
  name: rr
  labels:
    app.kubernetes.io/name: rr
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rr
  ports:
    - name: grpc
      port: 51001
      targetPort: 51001
    - name: admin
      port: 52001
      targetPort: 52001
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: Service
metadata:
  name: rr-client
  labels:
    app.kubernetes.io/name: rr
    app.kubernetes.io/component: client-endpoint
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rr
  ports:
    - name: grpc
      port: 51001
      targetPort: 51001
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rr
  labels:
    app.kubernetes.io/name: rr
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rr
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rr
  labels:
    app.kubernetes.io/name: rr
spec:
  serviceName: rr
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: rr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rr
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: render-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              set -eu
              ORDINAL="${POD_NAME##*-}"
              NODE_ID=$((ORDINAL + 1))
              if [ "$ORDINAL" = "0" ]; then
                BOOTSTRAP=true
                PEERS="[]"
              else
                BOOTSTRAP=false
                PEERS_JSON="["
                for i in $(seq 0 $((ORDINAL - 1))); do
                  [ $i -gt 0 ] && PEERS_JSON="${PEERS_JSON},"
                  PEERS_JSON="${PEERS_JSON}\"rr-${i}.rr:51001\""
                done
                PEERS="${PEERS_JSON}]"
              fi
              sed \
                -e "s|{{NODE_ID}}|${NODE_ID}|g" \
                -e "s|{{BOOTSTRAP}}|${BOOTSTRAP}|g" \
                -e "s|{{PEERS}}|${PEERS}|g" \
                /tmpl/config.toml.tmpl > /rendered/config.toml
              echo "--- rendered config for ${POD_NAME} ---"
              cat /rendered/config.toml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config-template
              mountPath: /tmpl
            - name: config-rendered
              mountPath: /rendered
      containers:
        - name: rr-server
          image: ghcr.io/gardenias/rr:latest
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/etc/rr/config.toml"]
          env:
            - name: RR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rr-admin-token
                  key: token
                  optional: true
            - name: RUST_LOG
              value: "info"
          ports:
            - name: grpc
              containerPort: 51001
            - name: admin
              containerPort: 52001
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rr/data
            - name: config-rendered
              mountPath: /etc/rr
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: config-template
          configMap:
            name: rr-config
        - name: config-rendered
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
