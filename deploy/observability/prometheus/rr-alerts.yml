# Prometheus alert rules for rr.
#
# Pair with `rr-recording-rules.yml`. Adjust thresholds to your
# cluster's SLOs — values below are reasonable defaults for a
# typical 3-5 node cluster on healthy networking.

groups:
  - name: rr_correctness
    rules:
      - alert: RrInsecureModeInProduction
        expr: rr_security_insecure_mode == 1
        for: 30s
        labels:
          severity: critical
          rr_component: security
        annotations:
          summary: "rr running with allow_insecure=true ({{ $labels.instance }})"
          description: |
            Node {{ $labels.instance }} is running without TLS+mTLS+admin_token
            enforcement. This is dev-only mode and MUST NOT run in production.
            See docs/deployment/tls.md.

      - alert: RrIdempotencyCollisionsObserved
        expr: rr:idempotency_collision_rate_5m > 0
        for: 5m
        labels:
          severity: warning
          rr_component: framework
        annotations:
          summary: "Idempotency collisions on group {{ $labels.group_id }}"
          description: |
            Two different client_ids reused the same (request_type, request_id)
            for at least 5m. The framework still dedups correctly but this
            indicates uncoordinated request_id allocation between writers.
            See docs/guide/idempotency.md.

      - alert: RrIngestorSeedFailures
        expr: increase(rr_ingestor_seed_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          rr_component: ingestor
        annotations:
          summary: "Kafka ingestor seed_offset failed on group {{ $labels.group_id }}"
          description: |
            The supervisor exited rather than running the ingestor with an
            unseeked consumer (which would replay from offset 0 under
            auto.offset.reset). Check broker reachability and the persisted
            offset in the latest snapshot. See docs/guide/kafka-input.md
            §Failure modes.

      - alert: RrIdempotencyCacheNearFull
        # Code cap is DEFAULT_IDEMPOTENCY_CACHE_SIZE = 10000
        # (crates/rr-raft/src/idempotency.rs) — alert at 80%.
        expr: rr_idempotency_cache_size > 8000
        for: 10m
        labels:
          severity: warning
          rr_component: framework
        annotations:
          summary: "Idempotency cache near full on group {{ $labels.group_id }}"
          description: |
            Idempotency cache approaching its 10000-entry eviction threshold;
            idempotency_expired errors will start firing if growth continues.
            Consider increasing NodeConfig::idempotency_cache_size or reducing
            client retry TTL.

      - alert: RrIngestorOffsetDrift
        expr: |
          (
            rate(rr_ingestor_seek_above_watermark_total[10m])
            + rate(rr_ingestor_seek_below_watermark_total[10m])
          ) > 0
        for: 10m
        labels:
          severity: warning
          rr_component: ingestor
        annotations:
          summary: "Ingestor offset drift detected on group {{ $labels.group_id }}"
          description: |
            Ingestor is repeatedly seeking outside known Kafka watermarks.
            Operator must investigate broker / topic state.

      - alert: RrFramingDecodeFailures
        expr: rate(rr_framing_decode_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          rr_component: framework
        annotations:
          summary: "Framing decode failures observed ({{ $labels.instance }})"
          description: |
            Frame decode is failing — possible wire-format incompatibility or
            storage corruption. Check ingestion side and snapshot fidelity.
            Refer to docs/docs/operations/runbooks/snapshot-corruption.md.

  - name: rr_availability
    rules:
      - alert: RrLeaderFlapping
        # rr:leader_churn_5m:rate is term-bumps PER SECOND summed across
        # instances; convert to elections/minute before thresholding.
        # > 1/minute: sustained churn beyond ~1 election per 2 minutes
        # (one election bumps the term on every instance: ~1.5/min at that
        # cadence on a 3-node group).
        expr: rr:leader_churn_5m:rate * 60 > 1
        for: 2m
        labels:
          severity: warning
          rr_component: raft
        annotations:
          summary: "Leader flapping on group {{ $labels.group_id }}"
          description: |
            > 1 election per 2 minutes sustained for 2m. Likely network
            instability, disk I/O contention, or undersized election timeout.
            See docs/operations/runbooks/leader-flapping.md.

      - alert: RrNoLeader
        expr: max by (group_id) (rr_raft_is_leader) == 0
        for: 30s
        labels:
          severity: critical
          rr_component: raft
        annotations:
          summary: "No leader for group {{ $labels.group_id }}"
          description: |
            No node reports rr_raft_is_leader=1 for this group. Writes are
            blocked. Check quorum (>= ceil((N+1)/2) replicas reachable).

      - alert: RrReplicationLagHigh
        # Use the leader-filtered recording rule: rr_raft_replication_lag is
        # only emitted on leaders, and `max by (group_id)` drops the instance
        # label, so an `and on (group_id, instance)` join can never match.
        expr: cluster:rr_replication_lag:max_per_group > 1000
        for: 5m
        labels:
          severity: warning
          rr_component: raft
        annotations:
          summary: "Replication lag > 1000 entries on group {{ $labels.group_id }}"
          description: |
            The slowest follower of group {{ $labels.group_id }} is > 1000
            entries behind the leader for at least 5m. Possible follower
            disk-stall or network partition.

      - alert: RrIngestorOffsetMapFailures
        # Fail-closed path: an unmappable Kafka offset means the ingestor
        # refuses to propose rather than risk the exactly-once contract.
        expr: increase(rr_ingestor_offset_map_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          rr_component: ingestor
        annotations:
          summary: "Ingestor offset→request_id mapping failed on group {{ $labels.group_id }}"
          description: |
            The ingestor hit an undecodable/overflowing Kafka offset and
            refused to propose (fail-closed). Investigate broker/topic state
            and the persisted offset in the latest snapshot.

      - alert: RrStorageWalFlushErrors
        # WAL fsync failures: acknowledged writes may not survive a power
        # loss — the durability contract is degrading in real time.
        expr: increase(rr_storage_wal_flush_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          rr_component: storage
        annotations:
          summary: "RocksDB WAL fsync failing on {{ $labels.instance }}"
          description: |
            flush_wal(true) is returning errors — committed entries may not
            be durable. Check disk health/space immediately.
