# rr perf-lab — production-shape 3-node kv-store cluster for performance
# measurement: rocks/strict + durable Raft log (ADR A-0016) + TLS/mTLS on all
# gRPC endpoints + admin/client bearer tokens + cpuset/mem limits.
#
# 本地性能实验环境 / LOCAL PERF LAB ONLY: self-signed certs, tokens from a
# local .env. The stack is the *secure* twin of deploy/lab (which stays
# byte-identical): RR_ALLOW_INSECURE must never appear here.
#
# Usage (repo root):
#   cp deploy/perf/.env.example deploy/perf/.env   # then edit tokens
#   deploy/perf/gen-certs.sh                        # CA + node certs (kv-N SANs)
#   docker compose -f deploy/perf/docker-compose.yml up -d --build
#   deploy/perf/selfcheck.sh                        # security-gate self-check
#   docker compose -f deploy/perf/docker-compose.yml down -v
#
# NOTE: kv-store's hand-rolled CLI parser only accepts `--flag value` (two
# argv items), NOT `--flag=value` — keep the command lists in split form.
#
# W6 (Kafka ingest) overlay ships as docker-compose.kafka.yml (M3); the W10
# (Toxiproxy WAN) profile is deferred — the plan marks W10 optional, and its
# roster-via-proxy topology lands when the first baseline (M4) exists.
# W8/W11 control legs are overlays too (docker-compose.insecure.yml /
# docker-compose.memlog.yml) — see scripts/prod-perf.sh.

name: rrperf

x-kv-common: &kv-common
  build:
    context: ../..
    dockerfile: deploy/perf/Dockerfile
  image: rr-perf:dev
  networks: [rrperf]
  # All nodes use the same internal ports; identity comes from the hostname.
  # Client+raft gRPC = 51001 (TLS/mTLS), admin gRPC = 52001 (TLS/mTLS+token),
  # metrics/HTTP = 9100 (plaintext, in-network only — nothing is published to
  # the host; load runs INSIDE the network, see README).
  environment:
    RUST_LOG: "info"
    RR_ADMIN_TOKEN: ${RR_ADMIN_TOKEN:?set RR_ADMIN_TOKEN in deploy/perf/.env — see .env.example}
    RR_CLIENT_TOKEN: ${RR_CLIENT_TOKEN:?set RR_CLIENT_TOKEN in deploy/perf/.env — see .env.example}
  volumes:
    - ./certs:/etc/rr/certs:ro
  # Resource isolation (plan §3.1): 2 dedicated cores + 2Gi per node, aligned
  # with the Helm limits. cpusets are env-overridable for hosts with <8 cores;
  # on macOS Docker Desktop they apply to the VM, not the host (numbers from
  # this machine are indicative only — record actual quotas in report meta).
  # KV_MEM_LIMIT: escape hatch for memory-heavy payload shapes (the
  # example's whole-map bincode snapshot transiently doubles the state).
  mem_limit: ${KV_MEM_LIMIT:-2g}
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/ready"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 15s

services:
  kv-1:
    <<: *kv-common
    container_name: perf-kv-1
    hostname: kv-1
    cpuset: ${KV1_CPUSET:-0-1}
    command:
      - "--node-id"
      - "1"
      - "--bootstrap"
      - "--port"
      - "51001"
      - "--listen-addr"
      - "0.0.0.0"
      - "--metrics-port"
      - "9100"
      - "--metrics-bind-host"
      - "0.0.0.0"
      - "--peers"
      - "1@kv-1:51001,2@kv-2:51001,3@kv-3:51001"
      - "--data-dir"
      - "/var/lib/rr/data"
      - "--tls-cert"
      - "/etc/rr/certs/node1.pem"
      - "--tls-key"
      - "/etc/rr/certs/node1.key"
      - "--tls-ca"
      - "/etc/rr/certs/ca.pem"
      - "--snapshot-logs-since-last"
      - "${SNAPSHOT_LOGS_SINCE_LAST:-50000}"
    volumes:
      - ./certs:/etc/rr/certs:ro
      - rrperf-data-1:/var/lib/rr/data

  kv-2:
    <<: *kv-common
    container_name: perf-kv-2
    hostname: kv-2
    cpuset: ${KV2_CPUSET:-2-3}
    command:
      - "--node-id"
      - "2"
      - "--port"
      - "51001"
      - "--listen-addr"
      - "0.0.0.0"
      - "--metrics-port"
      - "9100"
      - "--metrics-bind-host"
      - "0.0.0.0"
      - "--peers"
      - "1@kv-1:51001,2@kv-2:51001,3@kv-3:51001"
      - "--data-dir"
      - "/var/lib/rr/data"
      - "--tls-cert"
      - "/etc/rr/certs/node2.pem"
      - "--tls-key"
      - "/etc/rr/certs/node2.key"
      - "--tls-ca"
      - "/etc/rr/certs/ca.pem"
      - "--snapshot-logs-since-last"
      - "${SNAPSHOT_LOGS_SINCE_LAST:-50000}"
    volumes:
      - ./certs:/etc/rr/certs:ro
      - rrperf-data-2:/var/lib/rr/data
    depends_on:
      kv-1:
        condition: service_healthy

  kv-3:
    <<: *kv-common
    container_name: perf-kv-3
    hostname: kv-3
    cpuset: ${KV3_CPUSET:-4-5}
    command:
      - "--node-id"
      - "3"
      - "--port"
      - "51001"
      - "--listen-addr"
      - "0.0.0.0"
      - "--metrics-port"
      - "9100"
      - "--metrics-bind-host"
      - "0.0.0.0"
      - "--peers"
      - "1@kv-1:51001,2@kv-2:51001,3@kv-3:51001"
      - "--data-dir"
      - "/var/lib/rr/data"
      - "--tls-cert"
      - "/etc/rr/certs/node3.pem"
      - "--tls-key"
      - "/etc/rr/certs/node3.key"
      - "--tls-ca"
      - "/etc/rr/certs/ca.pem"
      - "--snapshot-logs-since-last"
      - "${SNAPSHOT_LOGS_SINCE_LAST:-50000}"
    volumes:
      - ./certs:/etc/rr/certs:ro
      - rrperf-data-3:/var/lib/rr/data
    depends_on:
      kv-2:
        condition: service_healthy

  # On-demand load generator, runs INSIDE the perf network so in-cluster
  # hostnames (and leader-redirect addresses) resolve. Not started by default:
  #   docker compose -f deploy/perf/docker-compose.yml --profile bench run --rm bench [args]
  # M2 landed the TLS/token client flags + open-loop scenarios: the default
  # command is a modest working smoke (wladder over mTLS). The W1–W9 matrix
  # arrives with M3 (scripts/prod-perf.sh). Plaintext probes stay available
  # via the selfcheck profile as the negative control.
  bench:
    image: rr-perf:dev
    container_name: rr-perf-bench
    networks: [rrperf]
    profiles: ["bench"]
    cpuset: ${BENCH_CPUSET:-6-7}
    mem_limit: 2g
    environment:
      RR_CLIENT_TOKEN: ${RR_CLIENT_TOKEN:?set RR_CLIENT_TOKEN in deploy/perf/.env — see .env.example}
    volumes:
      - ./certs:/etc/rr/certs:ro
    entrypoint: ["/usr/local/bin/rr-perf-bench"]
    command:
      - "--cluster-addrs=kv-1:51001,kv-2:51001,kv-3:51001"
      - "--scenario=wladder"
      - "--ladder-rates=100,500,1000,2000"
      - "--warmup-secs=5"
      - "--duration-secs=10"
      - "--tls-ca=/etc/rr/certs/ca.pem"
      - "--tls-cert=/etc/rr/certs/client.pem"
      - "--tls-key=/etc/rr/certs/client.key"
      - "--token-env=RR_CLIENT_TOKEN"
    depends_on:
      kv-1:
        condition: service_healthy
      kv-2:
        condition: service_healthy
      kv-3:
        condition: service_healthy

  # Shell for in-network probes (used by selfcheck.sh). Never started by
  # default:
  #   docker compose -f deploy/perf/docker-compose.yml --profile selfcheck run --rm probe -c '<cmd>'
  probe:
    image: rr-perf:dev
    container_name: rr-perf-probe
    networks: [rrperf]
    profiles: ["selfcheck"]
    entrypoint: ["/bin/bash"]
    volumes:
      - ./certs:/etc/rr/certs:ro
    depends_on:
      kv-1:
        condition: service_healthy
      kv-2:
        condition: service_healthy
      kv-3:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: rr-perf-prometheus
    hostname: prometheus
    networks: [rrperf]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rr-recording-rules.yml:/etc/prometheus/rr/recording-rules.yml:ro
      - ../observability/prometheus/rr-alerts.yml:/etc/prometheus/rr/alerts.yml:ro
    ports:
      - "127.0.0.1:9190:9090"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    image: grafana/grafana:latest
    container_name: rr-perf-grafana
    hostname: grafana
    networks: [rrperf]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/rr-cluster-overview.json:/var/lib/grafana/dashboards/rr-cluster-overview.json:ro
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - prometheus

networks:
  rrperf:
    driver: bridge

volumes:
  rrperf-data-1:
  rrperf-data-2:
  rrperf-data-3:
