[node]
id = 1
listen_addr = "0.0.0.0:51001"
data_dir = "/var/lib/rr/data"
admin_port = 52001
metrics_port = 9100
# Containers: publish admin/metrics beyond loopback so the host can
# reach them (compose maps 5200N/910N to these ports). LOCAL DEV ONLY.
admin_bind_host = "0.0.0.0"
metrics_bind_host = "0.0.0.0"
# The insecure opt-out (RR_ALLOW_INSECURE=true) is set in docker-compose.yml —
# 仅本地开发 / local dev only. This TOML stays production-shaped: for a real
# deployment add [tls] + [auth] admin_token instead of the env bypass. See
# `docs/docs/deployment/upgrading.md` for the secure-rollout procedure.

[storage]
backend = "rocks"
durability = "strict"

[cluster]
name = "rr-compose"
nodes = ["1@rr-1:51001", "2@rr-2:51001", "3@rr-3:51001"]

[cluster.formation]
mode = "genesis"
etcd_endpoints = ["http://etcd:2379"]
