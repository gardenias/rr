image:
  repository: ghcr.io/gardenias/rr
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 3

ports:
  grpc: 51001
  admin: 52001
  metrics: 9100

storage:
  backend: "rocks"
  durability: "strict"
  dataSize: "20Gi"
  storageClassName: ""

cluster:
  terminationGracePeriodSeconds: 30
  podDisruptionBudget:
    minAvailable: 2

auth:
  adminTokenSecret:
    name: "rr-admin-token"
    key: "token"
    # Fail fast at scheduling time when the Secret is missing — with
    # optional=true the pod would start WITHOUT RR_ADMIN_TOKEN and
    # rr-server would refuse to boot (gate G5), i.e. CrashLoopBackOff.
    optional: false

tls:
  enabled: false
  existingSecret: ""
  requireClientCert: false

security:
  # DEV/LOCAL ONLY — renders RR_ALLOW_INSECURE=true, bypassing rr-server's
  # startup security gates G1-G6 (no TLS / no mTLS / no admin token).
  # When false, tls.enabled=true (+ tls.requireClientCert=true) and
  # auth.adminTokenSecret.name are mandatory or the chart refuses to render.
  allowInsecure: false

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

serviceAccount:
  create: true
  name: ""

log:
  level: "info"
