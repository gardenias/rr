image:
  repository: ghcr.io/gardenias/rr
  # Required: rr 0.2.0 rejects [cluster.formation]. No compatible release is implied.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 3

ports:
  grpc: 51001
  admin: 52001
  metrics: 9100

metrics:
  # Required for kubelet probes and cross-pod Prometheus scraping.
  bindHost: "0.0.0.0"

storage:
  backend: "rocks"
  durability: "strict"
  dataSize: "20Gi"
  storageClassName: ""

cluster:
  terminationGracePeriodSeconds: 30
  podDisruptionBudget:
    minAvailable: 2
  # Raft group hosted by every pod (partition 1 → this group).
  groupId: 1
  name: "rr"
  formation:
    # genesis: concurrently initialize a fresh full-roster cluster.
    # adopt: record initialized legacy state; the job performs membership.
    mode: "genesis"
    # Adoption phase 1: set to the initialized ordinal count (for example, 1).
    # Phase 2: set to replicaCount to start pristine nodes and render the job.
    # Null preserves replicaCount; this never changes the SeedSpec roster.
    adoptionInitializedReplicas: null
    etcdEndpoints: ["http://rr-etcd:2379"]

auth:
  adminTokenSecret:
    name: "rr-admin-token"
    key: "token"
    # Fail fast at scheduling time when the Secret is missing — with
    # optional=true the pod would start WITHOUT RR_ADMIN_TOKEN and
    # rr-server would refuse to boot (gate G5), i.e. CrashLoopBackOff.
    optional: false

tls:
  enabled: false
  existingSecret: ""
  requireClientCert: false
  # SNI override for rr-admin clients (the cluster-form convergence job) when the
  # server certificates' SANs do not cover the in-cluster pod DNS names.
  domain: ""

security:
  # DEV/LOCAL ONLY — renders RR_ALLOW_INSECURE=true, bypassing rr-server's
  # startup security gates G1-G6 (no TLS / no mTLS / no admin token).
  # When false, tls.enabled=true (+ tls.requireClientCert=true) and
  # auth.adminTokenSecret.name are mandatory or the chart refuses to render.
  allowInsecure: false

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # readOnlyRootFilesystem breaks nothing in rr-server (state lives on the
  # data PVC, rendered config on an emptyDir) but flip deliberately — some
  # storage engines mmap/create temp files elsewhere.
  readOnlyRootFilesystem: false

serviceAccount:
  create: true
  name: ""

log:
  level: "info"
