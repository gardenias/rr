image:
  repository: ghcr.io/gardenias/rr
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 3

ports:
  grpc: 51001
  admin: 52001
  metrics: 9100

metrics:
  # Bind host for the Prometheus/health HTTP server. Leave empty for v0.2.0
  # images (their metrics server is already reachable cross-pod and the
  # strict config parser rejects this key). Set to "0.0.0.0" on server
  # >= 0.3.0, which defaults the HTTP server to loopback.
  bindHost: ""

storage:
  backend: "rocks"
  durability: "strict"
  dataSize: "20Gi"
  storageClassName: ""

cluster:
  terminationGracePeriodSeconds: 30
  podDisruptionBudget:
    minAvailable: 2
  # Raft group hosted by every pod (partition 1 → this group).
  groupId: 1

auth:
  adminTokenSecret:
    name: "rr-admin-token"
    key: "token"
    # Fail fast at scheduling time when the Secret is missing — with
    # optional=true the pod would start WITHOUT RR_ADMIN_TOKEN and
    # rr-server would refuse to boot (gate G5), i.e. CrashLoopBackOff.
    optional: false

tls:
  enabled: false
  existingSecret: ""
  requireClientCert: false
  # SNI override for rr-admin clients (the cluster-form hook job) when the
  # server certificates' SANs do not cover the in-cluster pod DNS names.
  domain: ""

security:
  # DEV/LOCAL ONLY — renders RR_ALLOW_INSECURE=true, bypassing rr-server's
  # startup security gates G1-G6 (no TLS / no mTLS / no admin token).
  # When false, tls.enabled=true (+ tls.requireClientCert=true) and
  # auth.adminTokenSecret.name are mandatory or the chart refuses to render.
  allowInsecure: false

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # readOnlyRootFilesystem breaks nothing in rr-server (state lives on the
  # data PVC, rendered config on an emptyDir) but flip deliberately — some
  # storage engines mmap/create temp files elsewhere.
  readOnlyRootFilesystem: false

serviceAccount:
  create: true
  name: ""

log:
  level: "info"
