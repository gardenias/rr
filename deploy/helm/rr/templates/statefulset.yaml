{{- /*
Security gate: keep the rendered manifest consistent with rr-server's
startup security validation (validate_security_invariants, gates G1-G7).
Configs that the server refuses at boot would CrashLoopBackOff, so refuse
to render them here instead:

  G1/G4: tls.enabled=false requires an explicit security.allowInsecure
         opt-in (local dev only).
  G2:    tls.enabled=true with tls.requireClientCert=false is rejected at
         boot — mTLS is the ONLY peer-identity check for RaftService.
  G5:    AdminService enabled without an admin token is rejected at boot,
         so auth.adminTokenSecret.name must be set (and the Secret must
         exist — see optional below).

G7 (TCP raft bind must be loopback) is never bypassable, but this chart
never enables the TCP raft transport.
*/ -}}
{{- if and (not .Values.tls.enabled) (not .Values.security.allowInsecure) -}}
{{- fail "rr chart: insecure configuration refused. tls.enabled=false combined with security.allowInsecure=false would crash-loop at startup (rr-server requires TLS+mTLS and an admin token by default). Either configure TLS (--set tls.enabled=true --set tls.existingSecret=<name> --set tls.requireClientCert=true) or, for LOCAL DEV ONLY, explicitly opt in with --set security.allowInsecure=true" -}}
{{- end -}}
{{- if and .Values.tls.enabled (not .Values.tls.requireClientCert) (not .Values.security.allowInsecure) -}}
{{- fail "rr chart: tls.enabled=true with tls.requireClientCert=false is rejected at boot (gate G2: RaftService peer identity is mTLS-only) and the pods would crash-loop. Set --set tls.requireClientCert=true (recommended) or, for LOCAL DEV ONLY, --set security.allowInsecure=true" -}}
{{- end -}}
{{- if and (not .Values.security.allowInsecure) (not .Values.auth.adminTokenSecret.name) -}}
{{- fail "rr chart: auth.adminTokenSecret.name is empty and security.allowInsecure=false; rr-server refuses to boot with AdminService enabled and no admin token (gate G5). Set auth.adminTokenSecret.name to an existing Secret" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rr.fullname" . }}
  labels:
    {{- include "rr.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "rr.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "rr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rr.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rr.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.cluster.terminationGracePeriodSeconds }}
      # Spread pods across nodes (best effort) so a single host failure cannot
      # take out 2 replicas and break raft quorum. Preferred, not required:
      # single-node local clusters must still schedule.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "rr.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: render-config
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              set -eu
              ORDINAL="${POD_NAME##*-}"
              NODE_ID=$((ORDINAL + 1))
              if [ "$ORDINAL" = "0" ]; then
                BOOTSTRAP=true
                PEERS="[]"
              else
                BOOTSTRAP=false
                PEERS_JSON="["
                for i in $(seq 0 $((ORDINAL - 1))); do
                  [ $i -gt 0 ] && PEERS_JSON="${PEERS_JSON},"
                  PEERS_JSON="${PEERS_JSON}\"{{ include "rr.fullname" . }}-${i}.{{ include "rr.fullname" . }}:{{ .Values.ports.grpc }}\""
                done
                PEERS="${PEERS_JSON}]"
              fi
              sed \
                -e "s|{{`{{NODE_ID}}`}}|${NODE_ID}|g" \
                -e "s|{{`{{BOOTSTRAP}}`}}|${BOOTSTRAP}|g" \
                -e "s|{{`{{PEERS}}`}}|${PEERS}|g" \
                /tmpl/config.toml.tmpl > /rendered/config.toml
              cat /rendered/config.toml
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: config-template
              mountPath: /tmpl
            - name: config-rendered
              mountPath: /rendered
      containers:
        - name: rr-server
          image: {{ include "rr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          args: ["serve", "--config", "/etc/rr/config.toml"]
          env:
            - name: RUST_LOG
              value: "{{ .Values.log.level }}"
            {{- if .Values.security.allowInsecure }}
            # DEV/LOCAL ONLY — bypasses startup security gates G1-G6 (the
            # G7 TCP-loopback gate is never bypassed; this chart does not
            # enable the TCP raft transport anyway).
            - name: RR_ALLOW_INSECURE
              value: "true"
            {{- end }}
            {{- if .Values.auth.adminTokenSecret.name }}
            - name: RR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.adminTokenSecret.name }}
                  key: {{ .Values.auth.adminTokenSecret.key }}
                  optional: {{ .Values.auth.adminTokenSecret.optional }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.ports.grpc }}
            - name: admin
              containerPort: {{ .Values.ports.admin }}
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          # Generous liveness window: a node replaying a large RocksDB raft
          # log can take over a minute before /health answers — killing it
          # mid-recovery restarts the clock forever.
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/rr/data
            - name: config-rendered
              mountPath: /etc/rr
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/rr/tls
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config-template
          configMap:
            name: {{ include "rr.fullname" . }}-config
        - name: config-rendered
          emptyDir: {}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ required "tls.existingSecret is required when tls.enabled=true" .Values.tls.existingSecret }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.dataSize }}
