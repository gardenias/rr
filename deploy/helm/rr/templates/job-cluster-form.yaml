# Legacy adoption/manual recovery only. Genesis forms through the lifecycle
# supervisor and must not run an ordinary membership job. Adoption records
# existing Raft state without expanding it; this job performs the explicit
# learner + full-roster membership convergence afterwards. Revision-specific
# names avoid mutating a completed Job's immutable pod template on upgrade.
{{- $rolloutReplicas := default .Values.replicaCount .Values.cluster.formation.adoptionInitializedReplicas -}}
{{- if and (eq .Values.cluster.formation.mode "adopt") (eq (int $rolloutReplicas) (int .Values.replicaCount)) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rr.fullname" . }}-cluster-form-{{ .Release.Revision }}
  labels:
    {{- include "rr.labels" . | nindent 4 }}
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "rr.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "rr.serviceAccountName" . }}
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cluster-form
          image: {{ include "rr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              FULLNAME='{{ include "rr.fullname" . }}'
              REPLICAS='{{ .Values.replicaCount }}'
              GRPC='{{ .Values.ports.grpc }}'
              ADMIN='{{ .Values.ports.admin }}'
              GROUP='{{ .Values.cluster.groupId }}'
              LEADER_ADMIN="${FULLNAME}-0.${FULLNAME}:${ADMIN}"
              TLS_ARGS='{{- if .Values.tls.enabled }}--tls-ca /etc/rr/tls/ca.crt --tls-cert /etc/rr/tls/tls.crt --tls-key /etc/rr/tls/tls.key{{ if .Values.tls.domain }} --tls-domain {{ .Values.tls.domain }}{{ end }}{{- end }}'

              echo "waiting for the bootstrap node's admin endpoint at ${LEADER_ADMIN} ..."
              i=0
              until rr-admin --addr "${LEADER_ADMIN}" ${TLS_ARGS} node status >/dev/null 2>&1; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "bootstrap node never came up" >&2
                  exit 1
                fi
                sleep 2
              done

              i=1
              while [ "$i" -lt "$REPLICAS" ]; do
                NODE_ID=$((i + 1))
                PEER="${FULLNAME}-${i}.${FULLNAME}:${GRPC}"
                echo "adding node ${NODE_ID} (${PEER}) as learner of group ${GROUP} ..."
                # Tolerated: re-adding an existing learner/voter errors on
                # re-runs; change-membership below is the authoritative step.
                rr-admin --addr "${LEADER_ADMIN}" ${TLS_ARGS} group add-learner \
                  --group "${GROUP}" --node-id "${NODE_ID}" --addr "${PEER}" || true
                i=$((i + 1))
              done

              VOTERS="$(seq -s, 1 "$REPLICAS")"
              echo "electing full voter set: ${VOTERS}"
              rr-admin --addr "${LEADER_ADMIN}" ${TLS_ARGS} group change-membership \
                --group "${GROUP}" --voters "${VOTERS}"
              echo "cluster formation complete"
          {{- if .Values.auth.adminTokenSecret.name }}
          env:
            - name: RR_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.adminTokenSecret.name }}
                  key: {{ .Values.auth.adminTokenSecret.key }}
                  optional: {{ .Values.auth.adminTokenSecret.optional }}
          {{- end }}
          {{- if .Values.tls.enabled }}
          volumeMounts:
            - name: tls
              mountPath: /etc/rr/tls
              readOnly: true
          {{- end }}
      {{- if .Values.tls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ required "tls.existingSecret is required when tls.enabled=true" .Values.tls.existingSecret }}
      {{- end }}
{{- end }}
