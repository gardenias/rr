apiVersion: v1
kind: Service
metadata:
  name: {{ include "rr.fullname" . }}
  labels:
    {{- include "rr.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "rr.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: {{ .Values.ports.grpc }}
    - name: admin
      port: {{ .Values.ports.admin }}
      targetPort: {{ .Values.ports.admin }}
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: {{ .Values.ports.metrics }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rr.fullname" . }}-client
  labels:
    {{- include "rr.labels" . | nindent 4 }}
    app.kubernetes.io/component: client-endpoint
spec:
  type: ClusterIP
  selector:
    {{- include "rr.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.ports.grpc }}
      targetPort: {{ .Values.ports.grpc }}
