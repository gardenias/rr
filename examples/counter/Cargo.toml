[package]
name = "counter"
version = "0.1.0"
edition = "2021"

[dependencies]
rr-core = { path = "../../crates/rr-core" }
rr-server = { path = "../../crates/rr-server" }
rr-raft = { path = "../../crates/rr-raft" }
rr-config = { path = "../../crates/rr-config" }
rr-storage = { path = "../../crates/rr-storage" }
rr-network = { path = "../../crates/rr-network" }
rr-router = { path = "../../crates/rr-router" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
serde.workspace = true
bincode.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
openraft = { workspace = true, features = ["serde"] }

[[bin]]
name = "counter"
path = "src/main.rs"
