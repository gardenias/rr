# rr-server 3-node cluster — NODE 3.
#
# Run this after nodes 1 and 2 are up. Node 3 becomes a voter only after the
# membership commands shown in 3node-cluster-node1.toml's header (peers below
# only builds the local routing table).

[node]
id = 3
listen_addr = "0.0.0.0:51001"
data_dir = "/var/lib/rr/data"
admin_port = 52001
metrics_port = 9100

[storage]
backend = "rocks"
durability = "strict"

[cluster]
bootstrap = false
peers = ["node-1.internal:51001", "node-2.internal:51001"]

[tls]
cert_path = "/etc/rr/tls/node3.pem"
key_path  = "/etc/rr/tls/node3.key"
ca_path   = "/etc/rr/tls/ca.pem"
require_client_cert = true
# domain_name = "node3.rr.local"

[auth]
admin_token_env = "RR_ADMIN_TOKEN"
client_token_env = "RR_CLIENT_TOKEN"
