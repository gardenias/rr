# rr-server 3-node cluster — NODE 2.
#
# Run this after node 1 is up and bootstrapped.

[node]
id = 2
listen_addr = "0.0.0.0:51001"
data_dir = "/var/lib/rr/data"
admin_port = 52001
metrics_port = 9100

[storage]
backend = "rocks"
durability = "strict"

[cluster]
bootstrap = false
peers = ["node-1.internal:51001"]
