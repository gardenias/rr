# rr-server single-node example configuration.
#
# Run with:
#   rr-server serve --config examples/config/single-node.toml
#
# This brings up a single-member cluster using the built-in echo state
# machine. Useful for smoke-testing the binary. For production, set
# storage.backend = "rocks" and configure node.data_dir.

[node]
id = 1
listen_addr = "127.0.0.1:51001"
# DEV/SMOKE ONLY — bypasses the startup security gates (no TLS / no admin
# token). Delete this and uncomment [tls]/[auth] below for anything real.
allow_insecure = true
# admin_port = 52001      # optional: enable AdminService on a separate port
# metrics_port = 9100     # optional: enable Prometheus /metrics HTTP endpoint

[storage]
# backend = "mem" is ephemeral (in-memory BTreeMap). For persistent storage
# set "rocks" and provide node.data_dir.
backend = "mem"
# durability: "strict" (default, required for Raft correctness),
#             "replicated_only" (fsync off locally — safe only with multi-node
#                              replication),
#             "test_only" (no WAL sync at all — tests only; total data loss
#                          on crash).
durability = "strict"

[cluster]
# Bootstrap = true makes this node initialize a single-member cluster.
# USE ONCE per cluster lifetime. Do not set `bootstrap = true` on a restart
# of an already-initialized node.
bootstrap = true
peers = []

# [tls]
# cert_path           = "/etc/rr/tls/node1.pem"
# key_path            = "/etc/rr/tls/node1.key"
# ca_path             = "/etc/rr/tls/ca.pem"
# require_client_cert = true
# domain_name         = "node1.rr.internal"
#
# [auth]
# admin_token_env  = "RR_ADMIN_TOKEN"
# client_token_env = "RR_CLIENT_TOKEN"
#
# See docs/docs/deployment/tls.md for how to generate dev certs via
# scripts/gen-dev-certs.sh and the full mTLS setup.
