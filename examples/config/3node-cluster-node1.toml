# rr-server 3-node cluster — NODE 1 (bootstrap node).
#
# USE THIS CONFIG ONLY ON NODE 1, AND ONLY AT INITIAL CLUSTER BRING-UP.
# Subsequent restarts of node 1 must use the same file but with
# cluster.bootstrap = false (or simply omit that flag).
#
# Membership note: peers/bootstrap below only build the LOCAL ROUTING TABLE.
# Nodes 2 and 3 join the raft group only after explicit membership changes
# from the leader (node 1):
#   rr-admin --addr <node1-host>:52001 group add-learner --group 1 \
#     --node-id 2 --addr <node2-host>:51001
#   rr-admin --addr <node1-host>:52001 group add-learner --group 1 \
#     --node-id 3 --addr <node3-host>:51001
#   rr-admin --addr <node1-host>:52001 group change-membership --group 1 --voters 1,2,3
# (RR_ADMIN_TOKEN must be set in the rr-admin environment; add
# --tls-ca/--tls-cert/--tls-key matching the [tls] section.)

[node]
id = 1
listen_addr = "0.0.0.0:51001"
data_dir = "/var/lib/rr/data"
boot_journal_dir = "/var/lib/rr/data/boot-journal"
advertise_addr = "node-1.internal:51001"
admin_advertise_addr = "node-1.internal:52001"
observability_advertise_addr = "node-1.internal:9100"
environment = "example"
admin_port = 52001
metrics_port = 9100

[storage]
backend = "rocks"
durability = "strict"

[cluster]
bootstrap = true
peers = []

# TLS + mTLS (required by the startup security gates — RaftService peer
# identity is mTLS-only). Generate dev keypairs with scripts/gen-dev-certs.sh;
# node certs carry SANs for rr-N and nodeN.rr.local. Every server that dials
# or accepts a dial verifies certificates, so each node needs resolvable
# hostnames covered by its cert SANs.
[tls]
cert_path = "/etc/rr/tls/node1.pem"
key_path  = "/etc/rr/tls/node1.key"
ca_path   = "/etc/rr/tls/ca.pem"
require_client_cert = true
# SNI override for outbound peer dials; unset = verify against the dialed
# hostname.
# domain_name = "node1.rr.local"

[auth]
# Tokens are read from the named ENVIRONMENT VARIABLES — never written in
# this file.
admin_token_env = "RR_ADMIN_TOKEN"
client_token_env = "RR_CLIENT_TOKEN"
