[package]
name = "kv-store"
version.workspace = true
edition = "2021"

[dependencies]
rr-core = { path = "../../crates/rr-core" }
rr-server = { path = "../../crates/rr-server" }
rr-raft = { path = "../../crates/rr-raft" }
rr-config = { path = "../../crates/rr-config" }
rr-config-etcd = { path = "../../crates/rr-config-etcd" }
rr-storage = { path = "../../crates/rr-storage" }
rr-network = { path = "../../crates/rr-network" }
rr-router = { path = "../../crates/rr-router" }
rr-client = { path = "../../crates/rr-client" }
rr-ingestor-kafka = { path = "../../crates/rr-ingestor-kafka", optional = true }
tokio.workspace = true
serde.workspace = true
bincode.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true
openraft = { workspace = true, features = ["serde"] }
# rustls is only used to install the process-global ring crypto provider
# before tonic TLS (server + ChannelPool) is configured (`--tls-*` flags).
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
etcd-client.workspace = true
tempfile.workspace = true
testcontainers = "0.22"

[features]
# Default builds without librdkafka / cmake; `--kafka-brokers` then fails
# fast with a rebuild hint. Add the `rdkafka` feature for real Kafka ingest.
default = []
rdkafka = ["dep:rr-ingestor-kafka", "rr-ingestor-kafka/rdkafka"]
# Durable Raft log and framework metadata (`--data-dir`), while business KV stays in memory.
rocks = ["rr-raft/rocks", "rr-storage/rocks"]

[[bin]]
name = "kv-store"
path = "src/main.rs"
