# Local 3-node dev cluster. NO TLS here, so every node explicitly opts out of
# rr-server's startup security gates G1-G6 via RR_ALLOW_INSECURE=true
# (see validate_security_invariants in crates/rr-server/src/node.rs; the G7
# TCP-loopback gate is never bypassed, and this file uses gRPC anyway).
# 仅本地开发 / LOCAL DEV ONLY — never reuse this file outside local dev; real
# deployments must configure [tls] + admin_token instead.
services:
  rr-1:
    build: .
    image: rr:dev
    container_name: rr-1
    hostname: rr-1
    networks: [rrnet]
    environment:
      RR_ALLOW_INSECURE: "true" # 仅本地开发 / local dev only, see header
    volumes:
      - rr1-data:/var/lib/rr/data
      - ./deploy/compose/config/node1.toml:/etc/rr/config.toml:ro
    ports:
      - "51001:51001"
      - "52001:52001"
      - "9101:9100"
    healthcheck:
      # /ready is served by the HTTP observability server on 0.0.0.0:9100
      # (metrics_port); curl is installed in the runtime image for this.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rr-2:
    image: rr:dev
    depends_on:
      rr-1:
        condition: service_healthy
    container_name: rr-2
    hostname: rr-2
    networks: [rrnet]
    environment:
      RR_ALLOW_INSECURE: "true" # 仅本地开发 / local dev only, see header
    volumes:
      - rr2-data:/var/lib/rr/data
      - ./deploy/compose/config/node2.toml:/etc/rr/config.toml:ro
    ports:
      - "51002:51001"
      - "52002:52001"
      - "9102:9100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rr-3:
    image: rr:dev
    depends_on:
      rr-1:
        condition: service_healthy
      rr-2:
        condition: service_healthy
    container_name: rr-3
    hostname: rr-3
    networks: [rrnet]
    environment:
      RR_ALLOW_INSECURE: "true" # 仅本地开发 / local dev only, see header
    volumes:
      - rr3-data:/var/lib/rr/data
      - ./deploy/compose/config/node3.toml:/etc/rr/config.toml:ro
    ports:
      - "51003:51001"
      - "52003:52001"
      - "9103:9100"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

networks:
  rrnet:
    driver: bridge

volumes:
  rr1-data:
  rr2-data:
  rr3-data:
