[package]
name = "rr-perf-bench"
version.workspace = true
edition = "2021"
publish = false
description = "Integration performance benchmark for rr: local 1/3/5-process Raft cluster, real gRPC traffic"

[[bin]]
name = "rr-perf-bench"
path = "src/main.rs"

[features]
default = []
# Allocator A/B switch mirroring rr-server's `mimalloc` feature, so the
# client process can be measured under the same allocator as the cluster.
mimalloc = ["dep:mimalloc"]

[dependencies]
rr-client  = { path = "../../crates/rr-client" }
# TlsConfig for the --tls-* client flags (rr-client does not re-export it).
rr-network = { path = "../../crates/rr-network" }
mimalloc   = { version = "0.1", optional = true }
tokio      = { workspace = true, features = ["full"] }
anyhow     = { workspace = true }
clap       = { version = "4", features = ["derive", "env"] }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile   = { workspace = true }
bincode    = { workspace = true }
rr-core    = { path = "../../crates/rr-core" }
hdrhistogram = "7"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
