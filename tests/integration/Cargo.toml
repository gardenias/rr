[package]
name = "integration"
version.workspace = true
edition = "2021"

[features]
rocks = ["rr-raft/rocks", "rr-storage/rocks"]

[dependencies]
rr-core = { path = "../../crates/rr-core" }
rr-server = { path = "../../crates/rr-server" }
rr-raft = { path = "../../crates/rr-raft" }
rr-config = { path = "../../crates/rr-config" }
rr-storage = { path = "../../crates/rr-storage" }
rr-network = { path = "../../crates/rr-network" }
rr-router = { path = "../../crates/rr-router" }
rr-ingestor-kafka = { path = "../../crates/rr-ingestor-kafka" }
kv-store = { path = "../../examples/kv-store" }
bincode = { workspace = true }
tokio.workspace = true
anyhow.workspace = true
async-trait.workspace = true
openraft = { workspace = true, features = ["serde"] }
tempfile.workspace = true
rr-client = { path = "../../crates/rr-client" }
dashmap = { workspace = true }
rand = "0.8"
tonic = { workspace = true }
tonic-health = "0.14"
serde.workspace = true

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = { workspace = true }
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# R-3 spike: deterministic simulation of tonic-over-turmoil (evidence test).
turmoil = { version = "0.7" }
async-stream = "0.3"
futures-core = "0.3"
hyper-util = "0.1"
tower-service = "0.3"
http = "1"
prost = { workspace = true }
tonic-prost = "0.14.5"
tracing.workspace = true
tracing-subscriber.workspace = true
