[package]
name = "integration"
version = "0.1.0"
edition = "2021"

[features]
rocks = ["rr-raft/rocks", "rr-storage/rocks"]

[dependencies]
rr-core = { path = "../../crates/rr-core" }
rr-server = { path = "../../crates/rr-server" }
rr-raft = { path = "../../crates/rr-raft" }
rr-config = { path = "../../crates/rr-config" }
rr-storage = { path = "../../crates/rr-storage" }
rr-network = { path = "../../crates/rr-network" }
rr-router = { path = "../../crates/rr-router" }
tokio.workspace = true
anyhow.workspace = true
async-trait.workspace = true
openraft = { version = "0.9", features = ["serde"] }
tempfile.workspace = true
rr-client = { path = "../../crates/rr-client" }
dashmap = { workspace = true }
rand = "0.8"
tonic = { workspace = true }
tonic-health = "0.14"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
