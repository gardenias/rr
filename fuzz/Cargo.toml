[package]
name = "rr-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# This crate is intentionally not in the workspace. cargo-fuzz expects
# a sub-crate with libfuzzer-sys + rustc nightly + the
# `panic = "abort"` profile. Adding it to [workspace.members] would
# break the parent workspace's stable-toolchain CI.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rr-core = { path = "../crates/rr-core" }
prost = { workspace = true }

# Tonic regenerates proto types in build.rs; we re-use the rr-network
# generated code so fuzz inputs match what flows over the wire.
[dependencies.rr-network]
path = "../crates/rr-network"

[workspace]

[profile.release]
debug = 1
panic = "abort"

[profile.dev]
panic = "abort"

[[bin]]
name = "fuzz_framed_snapshot_decode"
path = "fuzz_targets/fuzz_framed_snapshot_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_framed_entry_decode"
path = "fuzz_targets/fuzz_framed_entry_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_apply_outcome_decode"
path = "fuzz_targets/fuzz_apply_outcome_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_client_request_proto"
path = "fuzz_targets/fuzz_client_request_proto.rs"
test = false
doc = false
bench = false
