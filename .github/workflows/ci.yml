name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (etcd-client's build script compiles protos)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (default features)
        run: cargo build --workspace

  build-rocks:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rocks-${{ hashFiles('**/Cargo.lock') }}
      - name: Build with rocks feature
        run: cargo build --workspace --features rr-storage/rocks

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
    env:
      RUSTFLAGS: "--deny=warnings"
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (etcd-client's build script compiles protos)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Test (default features)
        run: cargo test --workspace

  test-rocks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
    env:
      RUSTFLAGS: "--deny=warnings"
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rocks-${{ hashFiles('**/Cargo.lock') }}
      - name: Test with rocks feature
        # integration/rocks gates the RocksDB persistence tests in tests/integration;
        # rr-storage/rocks alone does not propagate into that crate's cfg(feature = "rocks").
        run: cargo test --workspace --features rr-storage/rocks,integration/rocks

  test-defensive:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
    env:
      RUSTFLAGS: "--deny=warnings"
      RUST_BACKTRACE: 1
      RR_STORE_DEFENSIVE: "on"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (etcd-client's build script compiles protos)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-defensive-${{ hashFiles('**/Cargo.lock') }}
      - name: Test with defensive store mode
        run: cargo test --workspace

  clippy:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        # rocks-gated code (rocks benches, rocks log storage, persistence tests) must be linted too.
        run: cargo clippy --workspace --all-targets --features rocks -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt --check

  invariants-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check invariant registry links
        # Pure text check (bash + grep) — zero noise, blocking by design (R-1).
        run: bash scripts/check-invariants.sh

  coverage:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install RocksDB dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake protobuf-compiler
      - name: Generate coverage
        # integration/rocks needed so the rocks-gated persistence tests are included in coverage.
        run: cargo llvm-cov --workspace --features rr-storage/rocks,integration/rocks --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        # Note: CODECOV_TOKEN secret must be configured in repository settings
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  bench:
    runs-on: ubuntu-latest
    # Perf regression gate (R-7) — PROMOTED to blocking on 2026-09-22, after
    # the >=2-week non-blocking window (added 2026-09-06). Caveat: the window
    # was polluted by the CI-wide protoc outage, so the recorded false-positive
    # rate is thin; if the gate proves noisy on GitHub runners, demote by
    # restoring `continue-on-error: true` and file an issue instead of
    # widening thresholds. Thresholds: scripts/bench-compare.sh (>15%
    # significant => red, 5-15% => warning annotation).
    env:
      RUSTFLAGS: "--deny=warnings"
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (etcd-client's build script compiles protos)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Restore criterion baseline (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-main-${{ github.sha }}
          restore-keys: |
            criterion-main-
      - name: Install RocksDB dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake protobuf-compiler
      - name: Bench (compile + test mode)
        # rr-benches/rocks enables the required-features = ["rocks"] benches
        # (log_append_rocks, log_append_batched, log_tps), otherwise they are skipped.
        run: cargo bench --workspace --features rr-benches/rocks -- --test
      - name: Bench (save baseline on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo bench --workspace --features rr-benches/rocks -- --save-baseline main
      - name: Save criterion baseline cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: criterion-main-${{ github.run_id }}
      - name: Bench (compare against main baseline on PRs)
        if: github.event_name == 'pull_request'
        # No `|| true`: a bench crash must fail the gate, not pass it.
        run: |
          cargo bench --workspace --features rr-benches/rocks -- --baseline main | tee bench-output.txt
          scripts/bench-compare.sh bench-output.txt

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
      - name: Install protoc (etcd-client's build script compiles protos)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - name: Check MSRV
        run: cargo check --workspace

  doc-test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (etcd-client's build script compiles protos)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Run doc tests
        run: cargo test --doc --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        run: cargo audit

  nightly:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTFLAGS: "--deny=warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install protoc (etcd-client's build script compiles protos)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
      - name: Build with nightly
        run: cargo build --workspace

  test-macos:
    runs-on: macos-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (etcd-client's build script compiles protos)
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Test on macOS
        run: cargo test --workspace

  integration:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (etcd-client's build script compiles protos)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
      - name: Run integration tests
        run: cargo test -p integration

  external-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: "--deny=warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (etcd-client's build script compiles protos)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-external-broker-${{ hashFiles('**/Cargo.lock') }}
      - name: Run external broker tests (Kafka/etcd, opt-in)
        run: cargo test --workspace -- --ignored
