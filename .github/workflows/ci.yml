name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "--deny=warnings"
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc + librdkafka C deps (etcd-client / rdkafka-sys build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Per-job key: jobs sharing a key across different feature sets
          # would keep evicting each other's fingerprints.
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (default features)
        run: cargo build --workspace

  build-rocks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "--deny=warnings"
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rocks-${{ hashFiles('**/Cargo.lock') }}
      - name: Build with rocks feature
        run: cargo build --workspace --features rr-storage/rocks

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        rust: [stable]
    env:
      RUSTFLAGS: "--deny=warnings"
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc + librdkafka C deps (etcd-client / rdkafka-sys build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Test (default features)
        run: cargo test --workspace

  test-rocks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        rust: [stable]
    env:
      RUSTFLAGS: "--deny=warnings"
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-rocks-${{ hashFiles('**/Cargo.lock') }}
      - name: Test with rocks feature
        # integration/rocks gates the RocksDB persistence tests in tests/integration;
        # rr-storage/rocks alone does not propagate into that crate's cfg(feature = "rocks").
        run: cargo test --workspace --features rr-storage/rocks,integration/rocks

  test-defensive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        rust: [stable]
    env:
      RUSTFLAGS: "--deny=warnings"
      RUST_BACKTRACE: 1
      RR_STORE_DEFENSIVE: "on"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc + librdkafka C deps (etcd-client / rdkafka-sys build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-defensive-${{ hashFiles('**/Cargo.lock') }}
      - name: Test with defensive store mode
        run: cargo test --workspace

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "--deny=warnings"
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RocksDB dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - name: Clippy
        # rocks-gated code (rocks benches, rocks log storage, persistence tests) must be linted too.
        run: cargo clippy --workspace --all-targets --features rocks -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt --check

  invariants-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check invariant registry links
        # Pure text check (bash + grep) — zero noise, blocking by design (R-1).
        run: bash scripts/check-invariants.sh

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "--deny=warnings"
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install RocksDB dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - name: Generate coverage
        # integration/rocks needed so the rocks-gated persistence tests are included in coverage.
        run: cargo llvm-cov --workspace --features rr-storage/rocks,integration/rocks --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        # Note: CODECOV_TOKEN secret must be configured in repository settings
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Perf regression gate (R-7) — PROMOTED to blocking on 2026-09-22, after
    # the >=2-week non-blocking window (added 2026-09-06). Caveat: the window
    # was polluted by the CI-wide protoc outage, so the recorded false-positive
    # rate is thin; if the gate proves noisy on GitHub runners, demote by
    # restoring `continue-on-error: true` and file an issue instead of
    # widening thresholds. Thresholds: scripts/bench-compare.sh (>15%
    # significant => red, 5-15% => warning annotation).
    env:
      RUSTFLAGS: "--deny=warnings"
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc + librdkafka C deps (etcd-client / rdkafka-sys build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      - name: Restore criterion baseline (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: criterion-main-${{ github.sha }}
          restore-keys: |
            criterion-main-
      - name: Install RocksDB dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - name: Bench (compile + test mode)
        # rr-benches/rocks enables the required-features = ["rocks"] benches
        # (log_append_rocks, log_append_batched, log_tps), otherwise they are skipped.
        run: cargo bench --workspace --features rr-benches/rocks -- --test
      - name: Bench (save baseline on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cargo bench --workspace --features rr-benches/rocks -- --save-baseline main
      - name: Save criterion baseline cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: criterion-main-${{ github.run_id }}
      - name: Bench (compare against main baseline on PRs)
        if: github.event_name == 'pull_request'
        # No `|| true`: a bench crash must fail the gate, not pass it.
        run: |
          cargo bench --workspace --features rr-benches/rocks -- --baseline main | tee bench-output.txt
          scripts/bench-compare.sh bench-output.txt

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
      - name: Install protoc + librdkafka C deps (etcd-client / rdkafka-sys build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
      - name: Check MSRV
        run: cargo check --workspace

  doc-test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc + librdkafka C deps (etcd-client / rdkafka-sys build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-doc-test-${{ hashFiles('**/Cargo.lock') }}
      - name: Run doc tests
        run: cargo test --doc --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Run cargo audit
        run: cargo audit

  nightly:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      RUSTFLAGS: "--deny=warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install protoc + librdkafka C deps (etcd-client / rdkafka-sys build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
      - name: Build with nightly
        run: cargo build --workspace

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "--deny=warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc (etcd-client's build script compiles protos)
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-macos-${{ hashFiles('**/Cargo.lock') }}
      - name: Test on macOS
        run: cargo test --workspace

  integration:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny=warnings"
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc + librdkafka C deps (etcd-client / rdkafka-sys build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock') }}
      - name: Run integration tests
        run: cargo test -p integration

  external-broker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: "--deny=warnings"
      # Live-coverage switches (both test suites self-skip without them):
      #   RR_TEST_ETCD=1           — rr-config-etcd e2e via testcontainers
      #                              (ubuntu runners ship Docker; the test
      #                              pulls quay.io/coreos/etcd:v3.5.13).
      #   RR_TEST_KAFKA_BOOTSTRAP  — rr-ingestor-kafka e2e against the
      #                              redpanda container started below.
      RR_TEST_ETCD: "1"
      RR_TEST_KAFKA_BOOTSTRAP: "localhost:9092"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc + librdkafka C deps (etcd-client / rdkafka-sys build scripts)
        # cmake: rdkafka's `cmake-build` feature compiles librdkafka from source.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake libcurl4-openssl-dev zlib1g-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-external-broker-${{ hashFiles('**/Cargo.lock') }}
      # Same image/flags as deploy/lab/docker-compose.yml, except the
      # advertised listener is localhost (the tests run on the runner host,
      # not inside the compose network). Pinned to the digest verified
      # locally against these tests (v26.2.3); bump together with the lab.
      - name: Start redpanda (Kafka API for the live ingestor tests)
        run: |
          docker run -d --name redpanda -p 9092:9092 \
            docker.redpanda.com/redpandadata/redpanda@sha256:9e83cfa99278f30d0133271c26bf670cd69c94ffa6ba0b42830dd0c3bd9dcfd9 \
            redpanda start --overprovisioned --smp=1 --memory=512M \
            --reserve-memory=0M --node-id=0 --check=false \
            --kafka-addr=0.0.0.0:9092 --advertise-kafka-addr=localhost:9092
          for i in $(seq 1 60); do
            if docker exec redpanda /usr/bin/rpk cluster info >/dev/null 2>&1; then
              echo "redpanda healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "redpanda never became healthy" >&2
          docker logs redpanda >&2 || true
          exit 1
      - name: Run external broker tests (Kafka/etcd)
        # rr-ingestor-kafka/rdkafka is required: the live-broker tests are
        # feature-gated (`#![cfg(feature = "rdkafka")]`) — without it they
        # don't even compile in and this job would be green-by-construction.
        run: cargo test --workspace --features rr-ingestor-kafka/rdkafka -- --ignored
