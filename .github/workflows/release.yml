name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Derive version
        id: version
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Package and push Helm chart (OCI)
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Derive version
        id: version
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Update Chart version
        working-directory: deploy/helm/rr
        run: |
          sed -i "s|^version:.*|version: ${{ steps.version.outputs.version }}|" Chart.yaml
          sed -i "s|^appVersion:.*|appVersion: \"${{ steps.version.outputs.version }}\"|" Chart.yaml

      - name: Package chart
        run: helm package deploy/helm/rr -d dist/

      - name: Log in to GHCR (Helm)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Push chart
        run: |
          CHART="dist/rr-${{ steps.version.outputs.version }}.tgz"
          test -f "$CHART"
          helm push "$CHART" "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

  cargo:
    name: Publish rr crates to crates.io (opt-in)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          set -euo pipefail
          # IMPORTANT: crates.io builds do NOT carry the vendored openraft
          # patch — [patch.crates-io] path entries are workspace-local and are
          # stripped from published manifests, so a crates.io build resolves
          # the UNPATCHED openraft =0.10.0-alpha.34 from the registry.
          # Consumers that need the rr-patched openraft must depend via
          # git+tag instead (see the vendor/openraft membership note in the
          # workspace Cargo.toml). Publish to crates.io only for consumers
          # that are fine with the unpatched upstream openraft.
          for crate in rr-core rr-storage rr-config rr-network rr-router rr-raft rr-client rr-admin rr-server; do
            echo "==> publishing $crate"
            published=""
            for attempt in 1 2 3; do
              if out="$(cargo publish -p "$crate" --no-verify 2>&1)"; then
                echo "$out"
                published=1
                break
              fi
              echo "$out"
              # Idempotent re-runs: this version already uploaded = success.
              if grep -qi "already exists" <<<"$out"; then
                echo "$crate is already on crates.io at this version; continuing"
                published=1
                break
              fi
              echo "::warning::publish of $crate failed (attempt $attempt/3); retrying in 15s"
              sleep 15
            done
            if [ -z "$published" ]; then
              echo "::error::failed to publish $crate after 3 attempts — aborting release"
              exit 1
            fi
            # crates.io's sparse index is eventually consistent: give the
            # just-published crate time to become resolvable before the next
            # crate in dependency order tries to publish against it.
            sleep 15
          done
