# Semver Checks — cargo-semver-checks gate for the rr public API.
#
# rr 尚未发布 crates.io,无法使用 registry baseline。本 workflow 的做法:
# 当前代码 checkout 在 workspace 根目录,baseline tag(v0.2.0-rc2)checkout
# 到 `baseline/` 子目录,以 `--baseline-root` 做 git 基线对比。
#
# 基线策略:
# - baseline 为最新 release tag(当前 v0.2.0),阻塞式门禁。
# - v0.2.0 相对 0.1.0/rc 基线的 breaking changes 已记录在 CHANGELOG.md;
#   自 v0.2.0 起所有 breaking 变更必须在 PR 中经评审放行(门禁红灯即信号)。
# - `--workspace` 会检查 workspace 内所有可发布成员;`publish = false` 的
#   内部成员(benches、rr-perf-bench)会被自动跳过。fuzz 不是 workspace
#   成员,不参与检查。
# - 未配置依赖/目标缓存,rustdoc JSON 每次全量生成,job 耗时以分钟计;
#   如成为瓶颈可再评估缓存。
name: Semver Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semver-checks:
    name: "cargo-semver-checks (baseline: v0.2.0)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current code
        uses: actions/checkout@v4

      - name: Checkout baseline tag into ./baseline
        uses: actions/checkout@v4
        with:
          ref: v0.2.0
          path: baseline

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      - name: Run cargo-semver-checks (blocking gate)
        run: cargo semver-checks check-release --workspace --baseline-root baseline
