# Nightly fuzz campaign (work item R-6, informational — NOT a PR gate).
#
# Runs every fuzz target in fuzz/ for 15 minutes on the nightly toolchain
# with libFuzzer via cargo-fuzz. On a crash, the reproducer is minimized
# with `cargo fuzz tmin` and archived as a downloadable artifact.
#
# Triage contract: this workflow never blocks merges. Crash artifacts land
# in the run's artifact list, and a failure auto-files (or comments on) one
# open `nightly-failure` issue per target; deeper dedup (by backtrace hash)
# and weekly rollup stay with maintainers per the risk register in
# .sisyphus/plans/rr-reliability-program.md ("fuzz nightly 发现噪声化").
# The PR-level smoke from the R-6 design is deliberately NOT wired into
# ci.yml yet (noise control) — see the design doc before adding it.

name: Fuzz Nightly

on:
  schedule:
    # Daily at 03:23 UTC (deliberately off the top-of-hour herd).
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the on-failure step opens/comments on the tracking issue

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # one crashing target must not cancel the others
      matrix:
        target:
          - fuzz_framed_entry_decode
          - fuzz_framed_snapshot_decode
          - fuzz_apply_outcome_decode
          - fuzz_client_request_proto
          - fuzz_framed_entry_roundtrip
          - fuzz_apply_outcome_roundtrip
          - fuzz_batch_frame_decode
          - fuzz_batch_frame_roundtrip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      # Pin within the 0.12 series: installing from HEAD makes the nightly
      # unreproducible (a breaking cargo-fuzz release would fail every
      # target leg at once). Bump deliberately.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.12

      # Committed seed corpus lives in fuzz/corpus/<target>/ (cargo-fuzz
      # default convention); cargo fuzz picks it up automatically.
      - name: Fuzz ${{ matrix.target }} (15 min)
        run: >
          cargo +nightly fuzz run ${{ matrix.target }} --fuzz-dir fuzz
          -- -max_total_time=900 -error_exitcode=42

      # Minimize every crash reproducer in place so the archived artifact
      # is the smallest input that still crashes. Bounded to 4 minutes.
      - name: Minimize crash reproducer(s)
        if: failure()
        run: |
          for artifact in fuzz/artifacts/${{ matrix.target }}/crash-*; do
            [ -e "$artifact" ] || continue
            echo "minimizing $artifact"
            cargo +nightly fuzz tmin ${{ matrix.target }} "$artifact" \
              --fuzz-dir fuzz -- -max_total_time=240 || true
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}-run${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 30

      # Auto-file (or append to) a tracking issue. Dedupe key is workflow +
      # target: one open issue per fuzz target; repeat failures comment.
      - name: Open/update tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          label="nightly-failure"
          key="${{ github.workflow }} / ${{ matrix.target }}"
          title="[nightly] $key failed — $(date +%F)"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create "$label" --color db6d6d \
            --description "Automated nightly workflow failure tracker" --force >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --label "$label" \
            --search "\"$key\" in:title" --json number --jq ".[0].number")"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "Failed again on $(date +%F): $url"
            echo "commented on existing issue #$existing"
          else
            body="$(printf 'Scheduled fuzz run crashed for %s.\n\nRun: %s\n\nThe minimized reproducer (cargo fuzz tmin) is attached to the run as an artifact. Add it to fuzz/corpus/%s/ once fixed so the regression is caught on every run.\n\nClose this issue once triaged.' "${{ matrix.target }}" "$url" "${{ matrix.target }}")"
            gh issue create --label "$label" --title "$title" --body "$body"
            echo "issue created"
          fi
