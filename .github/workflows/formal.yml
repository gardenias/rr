# Weekly formal-verification run (work item R-2, informational — NOT a PR gate).
#
# Runs TLC model checking over the four rr-owned protocol specs in
# formal/tla/ (see formal/tla/README.md for the local runbook). Schedule-only
# by design: this workflow can never gate a PR. Triage contract: a failure is
# either "spec lagging the implementation" (update the spec) or a real
# implementation bug (file an issue); the TLC output is uploaded as an
# artifact for the former/latter classification.

name: Formal (TLA+)

on:
  schedule:
    # Weekly, Sunday 05:29 UTC (off-herd).
    - cron: '29 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the on-failure step opens/comments on the tracking issue

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download tla2tools.jar (pinned v1.7.4)
        run: |
          curl -sSL -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar

      - name: Run TLC over all specs
        working-directory: formal/tla
        run: |
          set -e
          for spec in MembershipGuard OffsetExactlyOnce OutputWatermark; do
            java -XX:+UseParallelGC -jar ../../tla2tools.jar -deadlock "$spec.tla"
          done
          for cfg in RoutingTableSwitch RoutingTableSwitchIncremental; do
            java -XX:+UseParallelGC -jar ../../tla2tools.jar -deadlock \
              -config "$cfg.cfg" RoutingTableSwitch.tla
          done

      - name: Upload TLC output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formal-tlc-${{ github.run_id }}
          path: formal/tla/
          if-no-files-found: ignore
          retention-days: 30

      # Auto-file (or append to) a tracking issue. Dedupe: one open issue
      # per workflow; repeat failures comment instead of duplicating.
      - name: Open/update tracking issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          label="nightly-failure"
          key="${{ github.workflow }}"
          title="[nightly] $key failed — $(date +%F)"
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh label create "$label" --color db6d6d \
            --description "Automated nightly workflow failure tracker" --force >/dev/null 2>&1 || true
          existing="$(gh issue list --state open --label "$label" \
            --search "\"$key\" in:title" --json number --jq ".[0].number")"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "Failed again on $(date +%F): $url"
            echo "commented on existing issue #$existing"
          else
            body="$(printf 'Scheduled TLC model-checking run failed.\n\nRun: %s\n\nThe TLC output is attached to the run as an artifact. Per the triage contract this is either "spec lagging the implementation" (update the spec) or a real implementation bug.\n\nClose this issue once triaged.' "$url")"
            gh issue create --label "$label" --title "$title" --body "$body"
            echo "issue created"
          fi
