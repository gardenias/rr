# Weekly formal-verification run (work item R-2, informational — NOT a PR gate).
#
# Runs TLC model checking over the four rr-owned protocol specs in
# formal/tla/ (see formal/tla/README.md for the local runbook). Schedule-only
# by design: this workflow can never gate a PR. Triage contract: a failure is
# either "spec lagging the implementation" (update the spec) or a real
# implementation bug (file an issue); the TLC output is uploaded as an
# artifact for the former/latter classification.

name: Formal (TLA+)

on:
  schedule:
    # Weekly, Sunday 05:29 UTC (off-herd).
    - cron: '29 5 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download tla2tools.jar (pinned v1.7.4)
        run: |
          curl -sSL -o tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar

      - name: Run TLC over all specs
        working-directory: formal/tla
        run: |
          set -e
          for spec in MembershipGuard OffsetExactlyOnce OutputWatermark; do
            java -XX:+UseParallelGC -jar ../../tla2tools.jar -deadlock "$spec.tla"
          done
          for cfg in RoutingTableSwitch RoutingTableSwitchIncremental; do
            java -XX:+UseParallelGC -jar ../../tla2tools.jar -deadlock \
              -config "$cfg.cfg" RoutingTableSwitch.tla
          done

      - name: Upload TLC output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formal-tlc-${{ github.run_id }}
          path: formal/tla/
          if-no-files-found: ignore
          retention-days: 30
