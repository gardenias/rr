[package]
name = "rr-admin"
version.workspace = true
edition = "2021"

[dependencies]
rr-core = { path = "../rr-core" }
rr-config-etcd = { path = "../rr-config-etcd" }
etcd-client = { workspace = true, features = ["tls"] }
rr-network = { path = "../rr-network" }
tokio.workspace = true
tonic.workspace = true
futures.workspace = true
serde.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
rustyline = "14"
bincode.workspace = true
tar = "0.4"
flate2 = "1"
walkdir = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.10"
hex = "0.4"
tracing.workspace = true
async-trait.workspace = true
uuid.workspace = true
subtle.workspace = true
rustls-pemfile.workspace = true
axum = "0.8"
base64 = "0.22"
tokio-stream = { version = "0.1", features = ["sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = "0.26"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# Live-node guard for `node-reset`: probes the RocksDB LOCK file via
# flock/fcntl (see node_reset::rocks_lock_held). Unix-only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
rr-config = { path = "../rr-config" }
rr-raft = { path = "../rr-raft" }
rr-router = { path = "../rr-router" }
rr-server = { path = "../rr-server" }
rr-storage = { path = "../rr-storage" }
openraft = { workspace = true, features = ["serde"] }

[[bin]]
name = "rr-admin"
path = "src/main.rs"
