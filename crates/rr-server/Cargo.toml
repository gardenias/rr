[package]
name = "rr-server"
version = "0.1.0"
edition = "2021"

[dependencies]
rr-core = { path = "../rr-core" }
rr-storage = { path = "../rr-storage" }
rr-config = { path = "../rr-config" }
rr-raft = { path = "../rr-raft" }
rr-network = { path = "../rr-network" }
rr-router = { path = "../rr-router" }
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tonic.workspace = true
metrics.workspace = true
metrics-exporter-prometheus = { version = "0.16", features = ["http-listener"] }
bincode.workspace = true
openraft.workspace = true
futures.workspace = true
tonic-health = "0.14"

[[bin]]
name = "rr-server"
path = "src/main.rs"
