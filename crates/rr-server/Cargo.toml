[package]
name = "rr-server"
version.workspace = true
edition = "2021"

[features]
default = []
rocks = ["rr-storage/rocks", "rr-raft/rocks"]
# A/B switch for the 100k roadmap (docs/perf/roadmap-100k.md M2): swap the
# global allocator for mimalloc. Off by default; measure before promoting.
mimalloc = ["dep:mimalloc"]

[dependencies]
rr-core = { path = "../rr-core" }
rr-storage = { path = "../rr-storage" }
rr-config = { path = "../rr-config" }
rr-raft = { path = "../rr-raft" }
rr-network = { path = "../rr-network" }
rr-router = { path = "../rr-router" }
dashmap.workspace = true
mimalloc = { version = "0.1", optional = true }
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tonic.workspace = true
metrics.workspace = true
metrics-exporter-prometheus = { version = "0.16", features = ["http-listener"] }
bincode.workspace = true
openraft.workspace = true
futures.workspace = true
tokio-stream = "0.1"
tonic-health = "0.14"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "rr-server"
path = "src/main.rs"
