syntax = "proto3";

package rr.admin;

/// Admin service for node management and observability.
service AdminService {
    /// Get node-level status.
    rpc GetNodeStatus(Empty) returns (NodeStatus);
    /// Get status for a specific Raft group.
    rpc GetGroupStatus(GroupId) returns (GroupStatus);
    /// List all local Raft groups with basic status.
    rpc ListGroups(Empty) returns (GroupList);
    /// Get snapshot progress/state for a specific Raft group.
    rpc GetSnapshotStatus(GroupId) returns (SnapshotStatus);
    /// Trigger a manual snapshot/log compaction for a group.
    /// Returns OK on success; failures are returned as gRPC Status.
    rpc TriggerSnapshot(GroupId) returns (Empty);
    /// Transfer leadership to another node.
    /// Returns OK on success; failures are returned as gRPC Status.
    rpc TransferLeader(TransferLeaderRequest) returns (Empty);
    /// Prepare a node for shutdown by draining leadership away.
    rpc DrainNode(DrainRequest) returns (DrainResult);
    /// Add a learner node to a Raft group. Learner replicates logs but
    /// does not vote — call ChangeMembership next to promote to voter.
    /// Returns OK on success; failures are returned as gRPC Status.
    rpc AddLearner(AddLearnerRequest) returns (Empty);
    /// Replace the voter set of a Raft group. Removed voters are kept
    /// as learners (`retain = true`). Must be called on the leader.
    /// Use RemoveGroupMember to erase a node from both voters and learners.
    /// The server rejects a target voter set smaller than 2 with
    /// `failed_precondition` unless `force` is set.
    /// Returns OK on success; failures are returned as gRPC Status.
    rpc ChangeMembership(ChangeMembershipRequest) returns (Empty);
    /// Remove one node from a Raft group's voters and learners.
    /// The server rejects voter removal below the minimum without `force`;
    /// removing the final voter is always rejected.
    /// Returns OK on success; failures are returned as gRPC Status.
    rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (Empty);
    /// Override the persisted ingestor offset for disaster recovery.
    /// `offset = -1` clears/unsets the persisted offset.
    /// Returns OK on success; failures are returned as gRPC Status.
    rpc ResetIngestorOffset(ResetIngestorOffsetRequest) returns (Empty);
    /// Get the current Raft group membership (voters + learners).
    rpc GetGroupMembership(GroupId) returns (GroupMembership);
    /// Stream a non-disruptive snapshot of a Raft group to the caller.
    /// First chunk carries metadata; subsequent chunks carry data.
    /// Server may trigger a fresh snapshot before streaming if
    /// `force_fresh_snapshot=true` or no snapshot exists yet.
    rpc OnlineBackup(OnlineBackupRequest) returns (stream OnlineBackupChunk);
    /// Get the current routing-table snapshot.
    rpc GetRoutingTable(Empty) returns (RoutingTableSnapshot);
    /// Get a top-level metrics summary.
    /// DEPRECATED (v1.0.0): unimplemented on the server — it previously
    /// returned constant zeros, a silent wrong answer. Scrape the
    /// Prometheus /metrics HTTP endpoint instead. Field numbers are
    /// retained for wire compatibility; do not reuse them.
    rpc GetMetricsSummary(Empty) returns (MetricsSummary);
    /// Get the cluster formation lifecycle status: origin, identity,
    /// per-group formation state, and the lifecycle store CAS revision.
    /// Returns OK on success; failures are returned as gRPC Status.
    rpc GetFormationStatus(Empty) returns (FormationStatus);
    /// Get framework/application build and protocol compatibility data.
    rpc GetBuildInfo(Empty) returns (BuildInfo);
    /// Get this process's explicit endpoints and placement metadata.
    rpc GetNodeDescriptor(Empty) returns (NodeDescriptorResponse);
    /// Get a stable, paginated directory and routing-table snapshot.
    rpc GetClusterTopology(ClusterTopologyRequest) returns (ClusterTopology);
    /// Get local replica state and, on a leader, its replication view.
    rpc GetGroupReplicaStatus(GroupId) returns (GroupReplicaStatus);
    /// Get the current boot and journal retention mode.
    rpc GetBootStatus(Empty) returns (BootStatus);
    /// List retained boots, newest first.
    rpc ListBootRecords(BootRecordsRequest) returns (BootRecordPage);
}

message Empty {}

message GroupId {
    uint64 group_id = 1;
}

message NodeStatus {
    uint64 node_id = 1;
    string listen_addr = 2;
    repeated uint64 group_ids = 3;
    uint64 uptime_secs = 4;
}

message GroupStatus {
    uint64 group_id = 1;
    bool is_leader = 2;
    uint64 current_term = 3;
    uint64 last_log_index = 4;
    uint64 leader_node_id = 5;
}

message GroupList {
    repeated GroupSummary groups = 1;
}

message GroupSummary {
    uint64 group_id = 1;
    bool is_leader = 2;
    uint64 current_term = 3;
    uint64 last_log_index = 4;
    optional uint64 leader_node_id = 5;
}

message SnapshotStatus {
    uint64 group_id = 1;
    /// DEPRECATED (v1.0.0): stub, always false — openraft 0.10 exposes no
    /// "snapshot build in progress" runtime flag. Use
    /// `last_snapshot_index` / `last_snapshot_term`. Field number retained
    /// for wire compatibility; do not reuse.
    bool snapshot_in_progress = 2;
    optional uint64 last_snapshot_index = 3;
    optional uint64 last_snapshot_term = 4;
}

message TransferLeaderRequest {
    uint64 group_id = 1;
    uint64 target_node_id = 2;
}

message DrainRequest {
    uint64 node_id = 1;
    uint32 timeout_secs = 2;
}

message DrainResult {
    repeated GroupDrainStatus groups = 1;
}

message GroupDrainStatus {
    uint64 group_id = 1;
    bool leadership_transferred = 2;
    string message = 3;
}

/// DEPRECATED (v1.0.0): `GetMetricsSummary` is unimplemented on the
/// server (it previously returned constant zeros). Use the Prometheus
/// /metrics endpoint. Field numbers retained; do not reuse.
message MetricsSummary {
    uint64 total_proposals = 1;
    uint64 total_applied = 2;
    uint64 total_snapshots = 3;
}

message AddLearnerRequest {
    uint64 group_id = 1;
    uint64 node_id = 2;
    string addr = 3;
}

message ChangeMembershipRequest {
    uint64 group_id = 1;
    repeated uint64 voter_node_ids = 2;
    /// Override the server-side quorum guard that rejects a target voter
    /// set smaller than 2 (`failed_precondition`). Reserved for disaster
    /// recovery (e.g. rebuilding after permanent loss of a majority);
    /// every forced acceptance emits a WARN audit event. Cannot be used
    /// to empty the voter set — teardown goes through `node-reset`.
    bool force = 3;
}

message RemoveGroupMemberRequest {
    uint64 group_id = 1;
    uint64 node_id = 2;
    /// Override the minimum-voter guard for disaster recovery. Cannot be
    /// used to remove the final voter; teardown goes through `node-reset`.
    bool force = 3;
}

message ResetIngestorOffsetRequest {
    uint64 group_id = 1;
    int64 offset = 2;
}

message NodeMember {
    uint64 node_id = 1;
    string addr = 2;
}

message GroupMembership {
    uint64 group_id = 1;
    repeated NodeMember voters = 2;
    repeated NodeMember learners = 3;
}

message OnlineBackupRequest {
    uint64 group_id = 1;
    bool force_fresh_snapshot = 2;
}

message OnlineBackupChunk {
    oneof body {
        OnlineBackupMetadata metadata = 1;
        bytes data = 2;
    }
}

message OnlineBackupMetadata {
    uint64 group_id = 1;
    uint64 last_log_index = 2;
    uint64 last_log_term = 3;
    uint64 size_bytes = 4;
    string rr_version = 5;
}

message RoutingTableSnapshot {
    repeated PartitionRoute partitions = 1;
}

message PartitionRoute {
    uint64 partition_id = 1;
    uint64 group_id = 2;
    repeated uint64 replica_node_ids = 3;
}

message FormationStatus {
    /// Cluster lifecycle origin: "Genesis", "LegacyAdopted", or
    /// "Untracked" when no lifecycle record exists (cluster predates
    /// formation tracking and has not been adopted; see the operations
    /// playbook).
    string origin = 1;
    /// Cluster identity minted at genesis (hyphenated UUID);
    /// empty when origin is "Untracked".
    string cluster_uuid = 2;
    /// Monotonic topology revision from the lifecycle record;
    /// 0 when untracked.
    uint64 topology_revision = 3;
    /// Lifecycle store CAS revision; 0 when untracked.
    uint64 store_revision = 4;
    /// Aggregate formation state: "Forming" while any group is forming,
    /// "Active" when every group is active, "Untracked" without a record.
    string state = 5;
    /// Per-group formation state (empty when untracked).
    repeated GroupFormationStatus groups = 6;
}

message GroupFormationStatus {
    uint64 group_id = 1;
    uint64 bootstrap_epoch = 2;
    /// "Forming" or "Active".
    string state = 3;
}

message ProtocolVersion {
    uint32 major = 1;
    uint32 minor = 2;
    uint32 min_peer_minor = 3;
}

message BuildInfo {
    string rr_version = 1;
    string app_version = 2;
    string git_commit = 3;
    bool git_dirty = 4;
    string build_profile = 5;
    ProtocolVersion admin_api = 6;
    ProtocolVersion raft_wire = 7;
    string boot_id = 8;
    uint64 process_start_unix_ms = 9;
    string config_fingerprint = 10;
}

message NodeDescriptor {
    uint64 node_id = 1;
    string client_addr = 2;
    string admin_addr = 3;
    string observability_addr = 4;
    string advertise_addr = 5;
    string environment = 6;
    optional string region = 7;
    optional string zone = 8;
    optional string rack = 9;
    string boot_id = 10;
}

message NodeDescriptorResponse {
    NodeDescriptor node_descriptor = 1;
    /// Directory mod_revision, or 0 when this process has not registered.
    uint64 directory_revision = 2;
}

message ClusterTopologyRequest {
    string cursor = 1;
    uint32 page_size = 2;
}

message NodeDirectoryEntry {
    NodeDescriptor node_descriptor = 1;
    uint64 revision = 2;
    int64 lease_id = 3;
}

message GroupTopology {
    uint64 group_id = 1;
    repeated uint64 replica_node_ids = 2;
}

message ClusterTopology {
    string snapshot_id = 1;
    uint64 config_revision = 2;
    uint64 directory_revision = 3;
    repeated NodeDirectoryEntry nodes = 4;
    repeated GroupTopology groups = 5;
    repeated PartitionRoute partitions = 6;
    string next_cursor = 7;
}

message LeaderReplicaStatus {
    uint64 node_id = 1;
    optional uint64 matched_index = 2;
    /// Present only when both the local last log and matched index are known.
    optional uint64 lag_entries = 3;
    optional uint64 last_heartbeat_unix_ms = 4;
}

message GroupReplicaStatus {
    uint64 group_id = 1;
    uint64 node_id = 2;
    string server_state = 3;
    optional uint64 leader_node_id = 4;
    uint64 current_term = 5;
    optional uint64 last_log_index = 6;
    optional uint64 local_commit_index = 7;
    optional uint64 cluster_commit_index = 8;
    optional uint64 applied_index = 9;
    optional uint64 last_snapshot_index = 10;
    optional uint64 last_snapshot_term = 11;
    /// Empty unless this node currently has a leader-only replication view.
    repeated LeaderReplicaStatus leader_replication = 12;
    uint64 observed_at_unix_ms = 13;
}

message BootRecord {
    string boot_id = 1;
    uint64 started_at_unix_ms = 2;
    optional uint64 ended_at_unix_ms = 3;
    /// RUNNING, GRACEFUL, or ABNORMAL_OR_UNCERTAIN.
    string shutdown_state = 4;
    BuildInfo build_info = 5;
}

message BootStatus {
    BootRecord current = 1;
    /// PERSISTENT or VOLATILE.
    string persistence = 2;
}

message BootRecordsRequest {
    string cursor = 1;
    uint32 page_size = 2;
}

message BootRecordPage {
    repeated BootRecord records = 1;
    string next_cursor = 2;
    /// PERSISTENT or VOLATILE.
    string persistence = 3;
}
