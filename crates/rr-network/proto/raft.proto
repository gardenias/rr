syntax = "proto3";

package rr.raft;

/// Raft internal RPC service for inter-node consensus communication.
service RaftService {
    /// AppendEntries RPC — log replication and heartbeat.
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
    /// RequestVote RPC — leader election.
    rpc Vote(VoteRequest) returns (VoteResponse);
    /// InstallSnapshot RPC — log compaction snapshot transfer (streaming).
    rpc InstallSnapshot(stream SnapshotChunk) returns (SnapshotResponse);
}

/// AppendEntries request. group_id is MANDATORY for multi-Raft demux.
message AppendEntriesRequest {
    uint64 group_id = 1;
    bytes payload = 2;
}

message AppendEntriesResponse {
    uint64 group_id = 1;
    bytes payload = 2;
}

/// Vote request. group_id is MANDATORY for multi-Raft demux.
message VoteRequest {
    uint64 group_id = 1;
    bytes payload = 2;
}

message VoteResponse {
    uint64 group_id = 1;
    bytes payload = 2;
}

/// Snapshot chunk for streaming snapshot installation.
message SnapshotChunk {
    uint64 group_id = 1;
    uint64 offset = 2;
    bytes data = 3;
    bool done = 4;
    bytes metadata = 5;
}

message SnapshotResponse {
    uint64 group_id = 1;
    bool success = 2;
}
