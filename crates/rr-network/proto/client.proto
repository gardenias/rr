syntax = "proto3";

package rr.client;

/// Client-facing RPC service for submitting requests and reading cluster state.
service ClientService {
    /// Submit a client request to a partition. Framework routes to correct Raft group.
    rpc Request(ClientRequest) returns (ClientResponse);
    /// Read from local replica's state machine (stale read).
    /// Bypasses Raft consensus. Any node can serve this request.
    rpc ReadLocal(ReadLocalRequest) returns (ReadLocalResponse);
    /// Read with linearizable semantics: server confirms leader commit
    /// index via Raft ReadIndex and waits until the local state machine
    /// has applied through it before serving the read. Per ADR A-0009
    /// this is a separate RPC (not a boolean flag on Request) so the
    /// consistency level is enforced at the protocol layer and cannot
    /// be silently downgraded.
    rpc ReadLinearizable(ReadLocalRequest) returns (ReadLocalResponse);
    /// Get cluster topology information.
    rpc GetClusterInfo(Empty) returns (ClusterInfo);
}

message Empty {}

/// Idempotency key carried by `ClientRequest` when the caller opts in to
/// framework-level deduplication. The pair (request_type, request_id) is
/// the dedup identity; client_id is diagnostic-only.
///
/// proto3 `optional` keeps this backward-compatible: a v0.1.x client
/// (which never sets `idem_key`) and a v0.2.x server (which checks for
/// presence) interoperate without renegotiation.
message IdempotencyKey {
    string request_type = 1;
    uint64 request_id = 2;
    optional string client_id = 3;
}

/// Wire-level error returned in `ClientResponse.idem_error` when the
/// request_id is below the framework watermark and has been evicted from
/// the LRU cache. Clients should pick a new request_id > watermark.
message IdempotencyError {
    string request_type = 1;
    uint64 request_id = 2;
    uint64 watermark = 3;
}

/// Client request. partition_id is used by framework to route to correct Raft group.
message ClientRequest {
    uint64 partition_id = 1;
    bytes payload = 2;
    /// Optional idempotency key. When present, the framework deduplicates
    /// retries with the same (request_type, request_id) and returns the
    /// cached response. When absent, the request follows v0.2.x semantics
    /// (no framework dedup).
    optional IdempotencyKey idem_key = 3;
}

/// Client response. Contains optional leader redirect info.
message ClientResponse {
    bool success = 1;
    bytes payload = 2;
    LeaderInfo leader_info = 3;
    /// Set when the framework rejected a request because its
    /// idempotency key has expired (request_id below watermark, no
    /// cache hit). Mutually exclusive with `payload` content (success
    /// will be false).
    optional IdempotencyError idem_error = 4;
}

/// Leader redirect information for client-side caching.
message LeaderInfo {
    uint64 node_id = 1;
    string addr = 2;
}

/// Cluster information for topology discovery.
message ClusterInfo {
    repeated GroupInfo groups = 1;
}

message GroupInfo {
    uint64 group_id = 1;
    uint64 leader_node_id = 2;
    repeated uint64 replica_node_ids = 3;
}

/// Request for the ReadLocal RPC — reads from local replica without consensus.
message ReadLocalRequest {
    uint64 partition_id = 1;
    bytes payload = 2;
}

/// Response from the ReadLocal / ReadLinearizable RPC.
///
/// When `leader_info` is set, the contacted replica was not the leader
/// (or could not run a ReadIndex round-trip locally) and is redirecting
/// the client. SDKs MUST treat a present `leader_info` as a redirect
/// regardless of `payload`. `payload` carries the read result only when
/// `leader_info` is unset.
message ReadLocalResponse {
    bytes payload = 1;
    optional LeaderInfo leader_info = 2;
}
