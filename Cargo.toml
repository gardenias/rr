[workspace]
members = [
    "crates/rr-core",
    "crates/rr-storage",
    "crates/rr-config",
    "crates/rr-config-etcd",
    "crates/rr-raft",
    "crates/rr-network",
    "crates/rr-router",
    "crates/rr-server",
    "crates/rr-client",
    "crates/rr-ingestor-kafka",
    "examples/kv-store",
    "examples/kv-store-kafka",
    "examples/etcd-config-quickstart",
    "examples/counter",
    "examples/otel-client",
    "tests/integration",
    "benches",
    "crates/rr-admin",
    "tools/rr-perf-bench",
]
resolver = "2"
[workspace.package]
version = "0.2.0"
rust-version = "1.88"


[workspace.dependencies]
openraft = "= 0.10.0-alpha.34"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14.5", features = ["tls-ring"] }
prost = "0.14.3"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2.0.0", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"
anyhow = "1"
dashmap = "6"
metrics = "0.24"
etcd-client = "0.14"
rocksdb = { version = "0.24.0", features = ["multi-threaded-cf"] }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
serde_json = "1"
