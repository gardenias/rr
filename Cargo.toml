[workspace]
members = [
    "crates/rr-core",
    "crates/rr-storage",
    "crates/rr-config",
    "crates/rr-config-etcd",
    "crates/rr-raft",
    "crates/rr-network",
    "crates/rr-router",
    "crates/rr-server",
    "crates/rr-client",
    "crates/rr-ingestor-kafka",
    "examples/kv-store",
    "examples/kv-store-kafka",
    "examples/etcd-config-quickstart",
    "examples/counter",
    "examples/otel-client",
    "tests/integration",
    "tests/crash",
    "benches",
    "crates/rr-admin",
    "tools/rr-perf-bench",
    "tools/rr-lab-producer",
    # vendor/openraft 列入 members（非 workspace 依赖继承）：让下游以
    # `git+tag` 方式拿到打过 rr 补丁的 openraft——依赖方的 [patch] 不传递，
    # my-biz 经 `[patch.crates-io] openraft = { git = <本仓>, tag = ... }`
    # 指向它（其清单是 crates.io 归一化形态，autotests=false，不会把
    # openraft 自带测试卷进本仓 --workspace 运行面）。
    "vendor/openraft",
]
resolver = "2"
[workspace.package]
version = "0.2.0"
rust-version = "1.98"


[workspace.dependencies]
openraft = "= 0.10.0-alpha.34"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14.5", features = ["tls-ring"] }
prost = "0.14.3"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2.0.0", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"
anyhow = "1"
dashmap = "6"
metrics = "0.24"
etcd-client = "0.14"
rocksdb = { version = "0.24.0", features = ["multi-threaded-cf"] }
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
serde_json = "1"
subtle = "2"

# Vendored openraft with the rr patch for the RaftCore panic at
# raft_core.rs `run_save_committed_and_apply` (unwrap on a log id purged by a
# racing snapshot). Upstream unfixed as of alpha.34/main; drop this patch when
# an upstream release contains the fix (track A-0015).
[patch.crates-io]
openraft = { path = "vendor/openraft" }
